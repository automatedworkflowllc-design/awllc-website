<script>
/* Oak Hammock hosted demo -- the UI layer over web/engine.js (window.OH).
 *
 * Everything the FastAPI templates do, in one hash-routed page, so the demo
 * can be SHOWN anywhere without Oak Hammock servers (Colin: "foolish to ask
 * them for oak hammock servers, for a demo"). The RULES all live in the
 * engine; this file only renders state and forwards gestures. If a decision
 * about money, identity, status or availability appears in this file, it is
 * in the wrong file.
 *
 * State: one localStorage key, per-browser. Two windows of the same browser
 * sync through the 'storage' event -- open the resident view and the staff
 * board side by side and an order placed in one appears in the other, which
 * is the pitch's live moment. localStorage can be absent (private windows,
 * thumbnailers): every access is wrapped, and the demo still works for the
 * session, it just forgets on reload.
 */
(function () {
  'use strict';

  var KEY = 'oakhammock-demo-v2';
  var STAFF_PASSPHRASE = 'oakhammock';   // same as the FastAPI demo

  /* ------------------------------------------------------------ storage */

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && d.seedVersion === window.OH_SEED_VERSION) return d;
      }
    } catch (e) { /* storage unavailable or corrupt: fall through to fresh */ }
    return { seedVersion: window.OH_SEED_VERSION,
             state: OH.newState(window.OH_SEED),
             session: { residentId: null, pendingId: null, staff: false } };
  }

  var D = load();

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { /* demo continues in-memory */ }
  }

  function resetDemo() {
    try { localStorage.removeItem(KEY); } catch (e) {}
    D = { seedVersion: window.OH_SEED_VERSION, state: OH.newState(window.OH_SEED),
          session: { residentId: null, pendingId: null, staff: false } };
    save();
    go('#/');
  }

  /* Another window changed the world: re-read and re-render in place. This
     is what makes resident + kitchen side-by-side feel live. */
  window.addEventListener('storage', function (e) {
    if (e.key !== KEY) return;
    var mine = D.session;
    D = load();
    D.session = mine;          // sessions are per-window by design
    render();
  });

  /* ------------------------------------------------------------ helpers */

  var $app = document.getElementById('app');

  /* A heading is an IDENTITY, and an identity rule gets ONE source -- the
     tested engine -- rather than a private copy here. See OH.groupKey. */
  var groupKey = OH.groupKey;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  var money = OH.money;

  function resident() {
    return D.session.residentId ? OH.residentById(D.state, D.session.residentId) : null;
  }

  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.classList.add('show'); });
    setTimeout(function () {
      t.classList.remove('show');
      setTimeout(function () { t.remove(); }, 400);
    }, 2200);
  }

  /* The allowance banner. One renderer so the menu, the venues page and the
     cart cannot state the balance three slightly different ways -- and so the
     "what this is based on" line can never be dropped from one of them. */
  function allowanceBanner() {
    if (!D.session.residentId) return '';
    var a = OH.allowanceState(D.state, D.session.residentId, monthNow());
    if (!a.known) {
      /* Unknown is NOT zero. Never imply a balance we do not have. And with
         nothing spent yet there is no fact worth stating at all, so the
         banner disappears rather than announcing "$0.00 of nothing". */
      if (!a.spent) return '';
      return '<div class="allow unknown"><strong>' + money(a.spent) +
        '</strong> in dining charges this month <span class="basis">(' +
        esc(a.basis) + ')</span></div>';
    }
    if (a.over) {
      return '<div class="allow over"><strong>' + money(a.over) +
        '</strong> over your monthly dining allowance ' +
        '<span class="basis">(' + esc(a.basis) + ')</span></div>';
    }
    var pct = Math.max(0, Math.min(100, Math.round(100 * a.remaining / a.allowance)));
    return '<div class="allow"><strong>' + money(a.remaining) +
      '</strong> of your ' + money(a.allowance) + ' dining allowance left ' +
      '<span class="basis">(' + esc(a.basis) + ')</span>' +
      '<span class="bar"><i style="width:' + pct + '%"></i></span></div>';
  }

  function monthNow() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  }

  function go(hash) {
    if (location.hash === hash) render();
    else location.hash = hash;
  }

  /* ------------------------------------------------------------- header */

  function header() {
    var r = resident();
    var nav = '';
    /* THE BAR BELONGS TO THE SCREEN YOU ARE ON, NOT THE PERSON YOU LAST WERE.
       This picked resident-first, so anyone who signed in as a resident and
       then used Staff sign-in got the KITCHEN BOARD wearing "Order Food ·
       Chat · My Cart · My Orders · Sign out (3112)". That is the demo path a
       GM walks: look at the resident side, then look at the kitchen side. */
    var audience = OH.navAudience(location.hash, !!r, !!D.session.staff);
    if (audience === 'resident') {
      nav = '<a href="#/venues">Order Food</a>' +
            '<a href="#/chat">Chat</a>' +
            '<a href="#/cart">My Cart' + cartBadge() + '</a>' +
            '<a href="#/orders">My Orders</a>' +
            '<a href="#/" data-act="signout">Sign out (' + esc(r.apartment) + ')</a>';
    } else if (audience === 'staff') {
      nav = '<a href="#/staff/queue">Queue</a>' +
            '<a href="#/staff/lineup">Line Up</a>' +
            '<a href="#/staff/menu">Menu Manager</a>' +
            '<a href="#/staff/billing">Billing</a>' +
            '<a href="#/" data-act="staffout">Sign out</a>';
    }
    return '<header class="topbar"><img src="' + window.OH_LOGO_WHITE +
      '" alt="Oak Hammock at the University of Florida"><span class="grow"></span>' +
      nav + '</header>';
  }

  function cartBadge() {
    if (!D.session.residentId) return '';
    var c = OH.cartContents(D.state, D.session.residentId);
    var n = c.rows.reduce(function (a, r) { return a + r.qty; }, 0);
    return n ? ' <span class="pill">' + n + '</span>' : '';
  }

  function footer() {
    return '<p class="footer-note">Oak Hammock at the University of Florida &middot; ' +
      '5100 SW 25th Blvd, Gainesville, FL &middot; 352-548-1000 &middot; ' +
      '<em>Demo — resident roster is placeholder data; menu transcribed from the ' +
      'printed menus and the kitchen’s Line Up sheet.</em> ' +
      '<a href="#" data-act="reset">Demo built by Automated Workflow, Gainesville, FL &middot; colin@automatedworkflowllc.com &middot; (703) 939-1174 &middot; Reset demo</a> &middot; ' +
      '<a href="#/staff">Staff sign-in</a></p>';
  }

  /* -------------------------------------------------------------- views */

  function viewSignin(msg) {
    return '<h1 class="script">Welcome to Oak Hammock dining.</h1>' +
      '<p class="sub">Order from our dining room — delivered to your door or ready for pickup.</p>' +
      (msg ? '<div class="notice">' + esc(msg) + '</div>' : '') +
      '<form data-form="signin"><label for="apt">Your apartment number</label>' +
      '<input class="biginput" type="text" id="apt" autocomplete="off" placeholder="e.g. 3112">' +

      '<strong>352-548-1000</strong> and we’ll take care of it.</p>' +
      /* These MUST match the roster. They did not after the apartment
         numbering was corrected -- the page still told people to type 204,
         which no longer exists, so following the demo's own instructions
         produced "we couldn't find that apartment". Found by opening the
         published page rather than by any test. */
      '<p class="sub">Try <strong>3112</strong> (or type it messily as ' +
      '<strong>31 12</strong> &mdash; same door). Try <strong>25</strong> to see ' +
      'what happens when a villa and an apartment share a number.</p>';
  }

  /* Two homes can share a number (a villa and an apartment), and the number
     is the billing account -- so this asks rather than picking. Same rule the
     chat uses for two dishes: an ambiguity is never resolved by a coin flip. */
  function viewWhich() {
    var ids = D.session.ambiguous || [];
    var opts = ids.map(function (id) {
      var r = OH.residentById(D.state, id);
      return '<p><button class="btn accent" data-act="which" data-id="' + r.id +

      '<p class="sub">More than one residence uses this number, so we would rather ask ' +
      'than guess &mdash; your dining charges go to whichever one you pick.</p>' +
      opts + '<p><a class="btn quiet" href="#/">None of these &mdash; start over</a></p>';
  }

  function viewConfirm() {
    var r = OH.residentById(D.state, D.session.pendingId);
    if (!r) return viewSignin();
    return '<h1 class="script">Welcome back!</h1>' +
      '<div class="card" style="max-width:26rem"><h3 style="font-size:1.4rem">' + esc(r.name) +
      '</h3><p>' + esc(OH.describeApartment(r.apartment, r.area)) + '</p></div>' +
      '<p style="margin-top:1.2rem"><button class="btn accent" data-act="confirm">' +
      'Yes, that’s me — let’s order</button> ' +
      '<a class="btn quiet" href="#/">That’s not me</a></p>';

  function viewVenues() {
    var r = resident();
    var vs = OH.venuesWithState(D.state, new Date());
    var mtd = OH.residentMonthTotal(D.state, r.id, monthNow());
    var c = OH.cartContents(D.state, r.id);
    var cards = vs.map(function (v) {
      var badge = v.kind === 'call' ? '' :
        (v.openNow ? '<span class="badge open">Open now</span>'
                   : '<span class="badge closed">Closed right now</span>');
      var act;
      if (v.kind === 'order') {
        act = '<a class="btn primary" href="#/menu">See menu &amp; order</a>';
      } else if (v.kind === 'visit') {
        act = '<p><em>Join us in person — this one’s about the company.</em></p>';
      } else {
        act = '<a class="btn quiet" href="tel:3525481000">Call 352-548-1000</a>';
      }
      return '<div class="card"><h3>' + esc(v.name) + '</h3>' + badge +
        '<p>' + esc(v.tagline) + '</p>' + act + '</div>';
    }).join('');
    cards += '<div class="card chatcard"><h3>Order by chat</h3>' +
      '<span class="badge open">New</span>' +
      '<p>Rather just say what you want? Type it in plain English and we will ' +
      'put the order together with you.</p>' +
      '<a class="btn accent" href="#/chat">Start a chat order</a></div>';
    return '<h1 class="script">Where would you like to eat today, ' +
      esc(r.name.split(' ')[0]) + '?</h1>' +
      allowanceBanner() +
      (c.total ? '<p class="sub">Cart: <strong>' + money(c.total) + '</strong></p>' : '') +
      '<div class="cards">' + cards + '</div>';

  function viewMenu() {
    var r = resident();
    var v = OH.venueBySlug(D.state, 'dining');
    var open = OH.isOpen(v.hours, new Date());
    var c = OH.cartContents(D.state, r.id);
    var inCart = {};
    c.rows.forEach(function (row) { inCart[row.itemId] = row.qty; });

    var items = D.state.items.filter(function (it) {
      /* servedToday gates the Wednesday cold soup. Note it is a separate test
         from is86: absent because it does not run today, versus absent
         because the kitchen ran out. A resident on a Tuesday should not be
         told the cold soup is sold out. */
      return it.venueSlug === 'dining' && !it.is86 && OH.servedToday(it, new Date());
    });
    /* Group: meal period -> section, preserving seed order.
       A HEADING IS AN IDENTITY, NOT A DISPLAY STRING -- the same trap that
       cost this project three defects on customer names. The staff form's
       default period was typed with a CURLY apostrophe ("Today’s Specials")
       and menu_data uses a straight one, so adding a special through the
       kitchen's own form produced a SECOND "Today's Specials" heading further
       down the same page, indistinguishable from the first. Group on a
       normalised key; display the spelling the kitchen actually used. */
    var order = [], groups = {};
    items.forEach(function (it) {
      var k = groupKey(it.mealPeriod);
      if (!groups[k]) {
        groups[k] = { label: it.mealPeriod, order: [], sections: {} };
        order.push(k);
      }
      var g = groups[k];
      var sk = groupKey(it.section);
      if (!g.sections[sk]) { g.sections[sk] = { label: it.section, rows: [] }; g.order.push(sk); }
      g.sections[sk].rows.push(it);
    });

    var allAllergens = {};
    var html = order.map(function (periodKey) {
      var g = groups[periodKey];
      return '<h2>' + esc(g.label) + '</h2>' + g.order.map(function (secKey) {
        var sect = g.sections[secKey];
        return '<h3 class="sec">' + esc(sect.label) + '</h3>' + sect.rows.map(function (it) {
          var sc = OH.allergenScan(it.name, it.description, it.allergens);
          sc.declared.concat(sc.suspected).forEach(function (a) { allAllergens[a] = 1; });
          var tags = (it.tags || []).map(function (t) {
            return '<span class="tag">' + esc(t) + '</span>';
          }).join('');
          if (it.isSpecial) tags += '<span class="tag special">Today’s Special</span>';
          return '<div class="mrow"><div class="info"><div class="name">' + esc(it.name) +
            tags + '</div><div class="desc">' + esc(it.description) + '</div>' +
            (sc.declared.length ? '<div class="allergens declared"><strong>Contains:</strong> ' +
              sc.declared.join(', ') + ' <span class="src">— from the kitchen</span></div>' : '') +
            (sc.suspected.length ? '<div class="allergens">May contain: ' +
              sc.suspected.join(', ') + '</div>' : '') +
            '</div><div class="buy"><div class="price">' + money(it.priceCents) + '</div>' +
            ((it.options && it.options.length)
              ? '<button class="btn primary small" data-act="choose" data-item="' + it.id +
                '">Choose options</button>'
              : '<button class="btn primary small" data-act="add" data-item="' + it.id + '">Add' +
                (inCart[it.id] ? ' (' + inCart[it.id] + ' in cart)' : '') + '</button>') +
            '</div></div>';
        }).join('');
      }).join('');
    }).join('');

    var legendOrder = OH.allergenTables().order.filter(function (a) {
      return allAllergens[a];
    });

    return '<p><a href="#/venues">&larr; All venues</a></p>' +
      '<h1 class="script">' + esc(v.name) + '</h1>' +
      '<p class="sub">' + esc(v.tagline) + ' ' +
      (open ? '<span class="badge open">Open now</span>'
            : '<span class="badge closed">Closed right now — you can still place an order for when we open</span>') +
      '</p>' + allowanceBanner() +
      '<p class="chatnudge">Long menu? <a href="#/chat">Just tell us what you want ' +
      'instead</a> &mdash; type it in plain English.</p>' + html +
      '<p style="margin-top:1.5rem"><span class="tag">VG</span> vegan option &nbsp;' +
      '<span class="tag">V</span> vegetarian &nbsp; <span class="tag">GF</span> gluten free &nbsp;' +
      '<span class="tag">DF</span> dairy free &nbsp; <span class="tag">BP</span> contains bell peppers</p>' +
      '<div class="notice"><strong>Common allergens on this menu:</strong> ' +
      (legendOrder.length ? legendOrder.join(', ') + '.' : 'none detected in the menu text.') +
      '<br>These notes are read automatically from the menu’s own wording — a ' +
      '<em>may-contain</em> guide, not a guarantee. For any allergy, please confirm with ' +
      'the kitchen at <strong>352-548-1044</strong> before ordering.</div>' +
      (c.total ? '<div class="cartbar"><span>Your cart: <strong>' + money(c.total) +
        '</strong></span><a class="btn accent" href="#/cart">Review &amp; place order</a></div>' : '');
  }


  /* The option picker. Colin, 2026-08-20: "try to imagine the experience end
     to end of what the customer would need to fully give their order" -- so a
     dish that comes with choices asks for them HERE, with real controls, and
     the kitchen ticket carries picked values instead of a typed paragraph.
     Radio for "choose one", checkbox for "choose up to N". The engine
     validates on add; this view only collects. */
  function viewChoose(itemId) {
    var it = OH.itemById(D.state, itemId);
    if (!it) return viewMenu();
    var sc0 = OH.allergenScan(it.name, it.description, it.allergens);
    var hints = sc0.declared.concat(sc0.suspected);
    var groups = (it.options || []).map(function (g, gi) {
      var one = g.type === 'choice';
      var opts = g.choices.map(function (ch, ci) {
        var nm = OH.choiceName(ch);
        var extra = (ch && ch.price_cents) ? ' <span class="sub">+' +
                    money(ch.price_cents) + '</span>' : '';
        return '<label class="radio"><input type="' + (one ? 'radio' : 'checkbox') +
          '" name="g' + gi + '" value="' + esc(nm) + '"><span>' + esc(nm) + extra +
          '</span></label>';
      }).join('');
      return '<fieldset class="optgroup" data-label="' + esc(g.label) + '" data-type="' +
        esc(g.type) + '"><legend>' + esc(g.label) +
        (one ? ' <span class="req">required</span>'
             : ' <span class="sub">(up to ' + (g.max || g.choices.length) + ')</span>') +
        '</legend>' + opts + '</fieldset>';
    }).join('');
    return '<p><a href="#/menu">&larr; Back to the menu</a></p>' +
      '<h1 class="script">' + esc(it.name) + '</h1>' +
      '<p class="sub">' + esc(it.description) + '</p>' +
      /* THE TWO TIERS STAY APART HERE TOO. This page used to concat declared
         onto suspected and print the lot as "May contain", so the menu row
         said "Contains: milk, tree nuts, wheat — from the kitchen" and one
         click later the same dish said "May contain: milk, tree nuts, wheat,
         eggs, fish, sesame". Downgrading the kitchen's own word to a guess is
         the one thing the three-tier design exists to prevent, and it did it
         on the page where somebody actually commits to the dish. */
      (sc0.declared.length ? '<div class="notice declared"><strong>Contains:</strong> ' +
        sc0.declared.join(', ') + ' — from the kitchen.</div>' : '') +
      (sc0.suspected.length ? '<div class="notice">May contain: ' +
        sc0.suspected.join(', ') + '.</div>' : '') +
      (hints.length ? '<div class="notice">Please confirm any allergy with the '
        + 'kitchen at <strong>352-548-1044</strong>. Sides and options you pick '
        + 'below are not included in this list.</div>' : '') +
      '<form data-form="choose" data-item="' + it.id + '">' + groups +
      '<label for="itemnote">Anything else about this dish?</label>' +
      '<input type="text" id="itemnote" maxlength="140" ' +
      'placeholder="e.g. no walnuts, dressing on the side">' +
      '<p style="margin-top:1.2rem"><button class="btn accent" type="submit">' +
      'Add to my order &middot; ' + money(it.priceCents) + '</button> ' +
      '<a class="btn quiet" href="#/menu">Cancel</a></p></form>';
  }


  /* ------------------------------------------------------------ the chat */

  /* Conversational ordering. Every turn goes: parse -> PROPOSE -> resident
     confirms -> engine validates. The chat never writes to the cart itself;
     the confirm button does, and the engine is what refuses a bad plate.
     That boundary is the whole safety argument, and it does not change when
     the parser is swapped for a language model. */
  function chatLog() {
    if (!D.session.chat) D.session.chat = [];
    return D.session.chat;
  }

  function say(who, text, html) {
    chatLog().push({ who: who, text: text, html: html || '' });
    if (chatLog().length > 40) chatLog().shift();
  }

  function viewChat() {
    var log = chatLog();
    if (!log.length) {
      say('bot', 'Hello! Tell me what you would like and I will put it together '
        + 'for you. For example: "the filet mignon, medium rare, with a baked '
        + 'potato and broccoli."');
    }
    var bubbles = log.map(function (m) {
      return '<div class="bub ' + m.who + '">' + (m.html || esc(m.text)) + '</div>';
    }).join('');
    var pend = D.session.pending;
    return '<p><a href="#/menu">&larr; Back to the menu</a></p>' +
      '<h1 class="script">Order by chat.</h1>' +
      '<p class="sub">Conversational ordering. It can only pick real dishes and '
      + 'real choices, it never sets a price, and nothing is ordered until you '
      + 'press the button.</p>' +
      '<div class="chatbox" id="chatbox">' + bubbles + '</div>' +
      (pend && pend.ready
        ? '<p><button class="btn accent" data-act="chat-confirm">Add ' +
          ((pend.qty || 1) > 1 ? pend.qty + ' &times; ' : '') +
          esc(pend.itemName) + ' to my order</button> ' +
          '<button class="btn quiet" data-act="chat-cancel">No, start over</button></p>'
        : '') +
      '<form data-form="chat"><label for="msg">Your message</label>' +
      /* Mobile keyboard hints matter here more than anywhere else in the app.
         autocorrect is OFF because the parser matches dish words exactly and
         iOS will happily "fix" shawarma into something that then cannot be
         found -- the resident sees "I could not find that" and blames the
         system. enterkeyhint puts Send on the keyboard's return key. */
      '<input type="text" id="msg" autocomplete="off" autocorrect="off" ' +
      'autocapitalize="sentences" spellcheck="false" enterkeyhint="send" ' +
      'placeholder="e.g. chicken shawarma, no tzatziki">' +
      '<p style="margin-top:.6rem"><button class="btn primary" type="submit">Send</button> ' +
      '<a class="btn quiet" href="#/cart">Review my order</a></p></form>';
  }

  function describeProposal(item, sel, note) {
    var txt = OH.describeSelections(sel);
    /* THE NOTE IS PART OF THE ORDER, so it is part of what we read back. A
       resident who typed "no sauce" and sees a confirmation without it has to
       assume we ignored them -- which, before this, we had. */
    return esc(item.name) + (txt ? ' \u2014 ' + esc(txt) : '') +
      (note ? ' \u2014 ' + esc(note) : '');
  }

  /* Ask for the next missing required group, as buttons rather than a quiz. */
  function askNext() {
    var p = D.session.pending;
    var item = OH.itemById(D.state, p.itemId);
    var missing = OHChat.missingGroups(item, p.selections);
    if (!missing.length) {
      p.ready = true;
      /* THE CHAT MUST SAY WHAT THE MENU SAYS. A dish confirmed here used to
         carry NO allergen information at all -- "Got it: Fresh Catch —
         Cooked: Baked | $14.00" on a plate the kitchen declared as milk, tree
         nuts and wheat -- while the menu row for the same dish printed all
         three. The menu page actively invites residents into this path, so
         the safer surface was handing off to the less safe one. */
      var sc = OH.allergenScan(item.name, item.description, item.allergens);
      var lines = '';
      if (sc.declared.length) {
        lines += '<br><span class="declared"><strong>Contains:</strong> ' +
          esc(sc.declared.join(', ')) + ' — from the kitchen.</span>';
      }
      if (sc.suspected.length) {
        lines += '<br><span class="sub">May contain: ' +
          esc(sc.suspected.join(', ')) + '.</span>';
      }
      if (lines) {
        lines += '<br><span class="sub">Please confirm any allergy with the '
          + 'kitchen at <strong>352-548-1044</strong>.</span>';
      }
      var each = item.priceCents + OH.extrasCents(item, p.selections);
      var n = Math.max(1, p.qty || 1);
      say('bot', '', 'Got it: <strong>' + (n > 1 ? n + ' &times; ' : '') +
        describeProposal(item, p.selections, p.note) + '</strong><br>' +
        (n > 1 ? OH.money(each) + ' each, ' + OH.money(each * n) + ' in total'
               : OH.money(each)) +
        '. Press the button below and I will add it to your order.' + lines);
      return;
    }
    p.asking = missing[0].label;
    var opts = OHChat.choiceNames(missing[0]).map(function (n) {
      return '<button class="chip" data-act="chat-pick" data-value="' + esc(n) + '">' +
        esc(n) + '</button>';
    }).join(' ');
    say('bot', '', 'And how would you like the <strong>' +
      esc(missing[0].label.toLowerCase()) + '</strong>?<br>' + opts);
  }

  /* The hand-off replies. ONE wording, called from two places -- the early
     check at the top of chatHandle and the normal path below it -- because
     two copies of a safety message is how one of them quietly goes stale. */
  function handleIntent(intent) {
    if (intent === 'allergy') {
      say('bot', '', 'I am not able to answer allergy questions — you should '
        + 'hear that from the kitchen rather than from me. Please call '
        + '<strong>352-548-1044</strong> and they will go through it with you. '
        + 'Every dish on <a href="#/menu">the menu</a> also lists what it contains.');
      return;
    }
    say('bot', '', 'That is one for the dining team rather than me. Please call '
      + '<strong>352-548-1000</strong> and they will help you sort it out.');
  }

  /* THE ESCALATION SEAM, and the reason the deterministic parser stays.
     
     The rules answer first. The model is asked ONLY about the outcomes where
     the rules are stuck -- "we do not serve that" and "did you mean" -- which
     on the measured corpus was 18 messages in 60. Everything else is answered
     here, instantly and free.

     THREE THINGS THIS MUST NEVER DO, each one a way a demo dies in front of
     somebody:
       - Require the network. With no endpoint configured, this returns the
         rules answer synchronously and the page is byte-for-byte the product
         it was before a model existed. That is every copy handed to anybody.
       - Hang. A slow endpoint falls back on a timer rather than leaving a
         resident watching a spinner.
       - Trust what comes back. A dish name is only accepted if it exists in
         THIS page's menu; anything else keeps the rules answer. The worker
         deliberately does not validate -- the check that protects a resident
         belongs next to the resident. */
  var REMOTE_POLICY = ['unknown', 'didyoumean'];

  function remoteConfig() {
    var c = window.OH_REMOTE_CHAT;
    return (c && typeof c.url === 'string' && c.url) ? c : null;
  }

  function adoptRemote(raw, fallback) {
    if (!raw || typeof raw !== 'object') return fallback;
    var byName = {};
    (D.state.items || []).forEach(function (it) {
      byName[String(it.name).toLowerCase()] = it;
    });
    function look(n) {
      return typeof n === 'string' ? byName[n.trim().toLowerCase()] || null : null;
    }
    if (raw.intent === 'diet' || raw.intent === 'allergy') return { intent: 'allergy' };
    if (raw.intent === 'menu' || raw.intent === 'recommend') return { intent: raw.intent };
    if (raw.intent === 'order') {
      var it = look(raw.dish);
      /* A dish this page does not have never becomes an order. */
      return it ? { intent: 'order', item: it, selections: {}, note: '', qty: 1 } : fallback;
    }
    if (raw.intent === 'ambiguous') {
      var opts = (raw.options || []).map(look).filter(Boolean);
      return opts.length ? { intent: 'ambiguous', exact: false, options: opts } : fallback;
    }
    /* An emptier refusal than the one already in hand is not an improvement. */
    return fallback;
  }

  function withProposal(text, done) {
    var prop = OHChat.propose(D.state, text);
    var cfg = remoteConfig();
    if (!cfg || REMOTE_POLICY.indexOf(prop.intent) === -1) { done(prop); return; }

    var settled = false;
    function finish(p) { if (!settled) { settled = true; done(p); } }
    setTimeout(function () { finish(prop); }, cfg.timeoutMs || 6000);

    try {
      fetch(cfg.url, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ passphrase: cfg.passphrase || '', text: text })
      }).then(function (r) {
        return r.ok ? r.json() : null;
      }).then(function (body) {
        finish(body ? adoptRemote(body.proposal, prop) : prop);
      })['catch'](function () { finish(prop); });
    } catch (e) { finish(prop); }
  }

  function chatHandle(text) {
    say('you', text);
    var p = D.session.pending;

    /* AN ALLERGY QUESTION OUTRANKS THE QUESTION WE ASKED. With a side group
       pending, "can I eat the broccoli with my allergy?" was consumed as the
       ANSWER -- First side: Broccoli -- and the chat moved on to ask about the
       second side. The utterance detects as `allergy`; nothing ever looked,
       because the pending-group branch ran first. A question about an allergy
       that gets silently answered with a plate of the thing is the worst
       failure this feature has. */
    var earlyIntent = OHChat.detectIntent(text, D.state);
    if (earlyIntent === 'allergy' || earlyIntent === 'diet') {
      handleIntent(earlyIntent);
      return;
    }

    /* Answering the question we just asked takes priority, so a bare "rare"
       is read as an answer and not as a new dish. */
    if (p && p.asking) {
      var pitem = OH.itemById(D.state, p.itemId);
      var grp = (pitem.options || []).filter(function (g) {
        return g.label === p.asking;
      })[0];
      var ans = grp && OHChat.answerGroup(grp, text);
      if (ans) {
        p.selections[p.asking] = [ans];
        p.asking = null;
        askNext();
        return;
      }
    }

    /* THE MODEL IS ASKED ONLY WHEN THE RULES GET STUCK, and only if this
       build was given an endpoint. With none configured -- which is every
       copy of this file handed to somebody -- withProposal calls back
       synchronously with the rules' own answer and this page behaves exactly
       as it did before the model existed. Measured: rules alone 75.0%
       first-time, rules plus the model on stuck utterances 93.3%, with 70%
       of messages never leaving the machine. */
    withProposal(text, function (prop) {

    if (prop.intent === 'allergy' || prop.intent === 'diet') {
      handleIntent(prop.intent);
      return;
    }
    if (prop.intent === 'didyoumean') {
      /* A TYPO, ANSWERED AS A QUESTION. Never proposed: an edit-distance match
         is a guess, and the house rule is that a guess is never rendered as a
         fact. It names what they typed so they can see why it is asking. */
      say('bot', '', 'I do not have <strong>' + esc(prop.typed) + '</strong> — '
        + 'did you mean:<br>' + prop.options.map(function (it) {
            return '<button class="chip" data-act="chat-item" data-item="' + it.id + '">' +
              esc(it.name) + ' &middot; ' + money(it.priceCents) + '</button>';
          }).join(' '));
      return;
    }
    if (prop.intent === 'usual') {
      /* ANSWERED FROM THEIR OWN HISTORY OR NOT AT ALL. Most residents eat the
         same handful of things, so this is the shortest path there is -- but
         it must never become a guess about what somebody might like. */
      var mine = OH.residentOrders(D.state, D.session.residentId)
        .filter(function (o) { return o.status !== 'CANCELLED'; });
      if (!mine.length) {
        say('bot', '', 'This is your first order with me, so I do not know your '
          + 'usual yet — tell me what you would like and it will be here next '
          + 'time. <a href="#/menu">The menu</a> is this way.');
        return;
      }
      var last = mine[0];
      say('bot', '', 'Last time you had <strong>' +
        last.items.map(function (li) {
          return esc(li.name) + (li.qty > 1 ? ' &times; ' + li.qty : '');
        }).join(', ') + '</strong>. Shall I put that in again?<br>' +
        '<button class="chip" data-act="chat-again" data-order="' + last.id +
        '">Yes, the same again</button>');
      return;
    }
    if (prop.intent === 'recommend') {
      /* Today's specials, off the kitchen's own Line Up -- not a preference
         model. We do not know what this resident likes and must not pretend
         to. */
      var specials = D.state.items.filter(function (it) {
        return !it.is86 && it.isSpecial;
      }).slice(0, 5);
      if (!specials.length) {
        specials = D.state.items.filter(function (it) { return !it.is86; }).slice(0, 4);
      }
      say('bot', '', 'Today the kitchen is making:<br>' +
        specials.map(function (it) {
          return '<button class="chip" data-act="chat-item" data-item="' + it.id + '">' +
            esc(it.name) + ' &middot; ' + money(it.priceCents) + '</button>';
        }).join(' ') +
        '<br><span class="sub">Or see <a href="#/menu">the whole menu</a>.</span>');
      return;
    }
    if (prop.intent === 'side') {
      /* They named a SIDE, not a dish. "I could not find that on today's
         menu" would be a lie -- the fries are on the menu, they just need
         something to sit beside. Colin: "french fries are definitely a
         side". */
      if ((prop.sideOf || []).length) {
        say('bot', '', '<strong>' + esc(prop.side) + '</strong> is one of the '
          + 'choices on ' + prop.sideOf.map(function (n) {
              return '<strong>' + esc(n) + '</strong>';
            }).join(' or ') + '. Shall I start one of those?<br>' +
          prop.sideOf.map(function (n) {
            var it = D.state.items.filter(function (x) { return x.name === n; })[0];
            return it ? '<button class="chip" data-act="chat-item" data-item="' +
              it.id + '">' + esc(it.name) + ' &middot; ' + money(it.priceCents) +
              '</button>' : '';
          }).join(' '));
        return;
      }
      say('bot', '', '<strong>' + esc(prop.side) + '</strong> comes as a side. '
        + 'Which dish would you like it with? Tell me the dish and I will put '
        + 'them together — or have a look at <a href="#/menu">the menu</a>.');
      return;
    }
    if (prop.intent === 'done') {
      say('bot', '', 'Lovely \u2014 when you are ready, '
        + '<a href="#/cart">review and send it to the kitchen</a>.');
      return;
    }
    if (prop.intent === 'reset') {
      D.session.pending = null;
      say('bot', 'No problem, we will start again. What would you like?');
      return;
    }
    if (prop.intent === 'menu' || prop.intent === 'help') {
      say('bot', '', 'You can say things like <em>"chicken shawarma"</em>, '
        + '<em>"filet mignon medium rare with broccoli"</em>, or '
        + '<em>"the daily dessert"</em>. The full menu is '
        + '<a href="#/menu">here</a> if you would rather tap than type.');
      return;
    }
    if (prop.intent === 'ambiguous') {
      var opts = prop.options.map(function (it) {
        return '<button class="chip" data-act="chat-item" data-item="' + it.id + '">' +
          esc(it.name) + ' \u00b7 ' + OH.money(it.priceCents) + '</button>';
      }).join(' ');
      /* Two kinds of tie. A dish named completely, where only the size is
         open, gets "which one?". A dish NOT named completely -- "chicken
         parmesan", which half-fits four things and matches none -- must not
         be told we heard it right, because we did not. */
      say('bot', '', (prop.exact
        ? 'I want to be sure I heard you right \u2014 which one?'
        : 'I do not have that exactly. Did you mean one of these?') +
        '<br>' + opts);
      return;
    }
    if (prop.intent === 'unknown') {
      /* NAME WHAT THEY ASKED FOR. "I could not find that" leaves a resident
         wondering whether they typed it wrong; "I do not see a hamburger on
         today's menu" tells them the dish is the problem, not them. Colin's
         very first message to the live chat was exactly this case. */
      var asked = prop.notOnMenu || OHChat.unmatchedDish(D.state, text);
      say('bot', '', (asked
          ? 'I do not see <strong>' + esc(asked) + '</strong> on today’s menu.'
          : 'I could not find that on today’s menu.')
        + ' I would rather say so than guess. Have a look at '
        + '<a href="#/menu">the menu</a> — or if you would like something that '
        + 'is not on it, the front desk can sort it out on '
        + '<strong>352-548-1000</strong>.');
      return;
    }

    D.session.pending = {
      itemId: prop.item.id, itemName: prop.item.name,
      selections: prop.selections, asking: null, ready: false,
      /* A hold we could not match to an option rides along as the line's
         free-text note, so it reaches the kitchen ticket instead of being
         silently dropped. See OHChat.unmatchedHolds. */
      note: prop.note || '',
      qty: prop.qty || 1
    };
    /* A SECOND DISH IS SAID OUT LOUD, never dropped in silence. The chat takes
       one plate at a time because each needs its own options confirmed. */
    if ((prop.alsoAsked || []).length) {
      say('bot', '', 'I can take one dish at a time, so I will start with '
        + '<strong>' + esc(prop.item.name) + '</strong> — then tell me about the '
        + prop.alsoAsked.map(function (n) { return '<strong>' + esc(n) + '</strong>'; })
            .join(' or the ') + ' and I will add that too.');
    }
    askNext();
    });
  }

  function viewCart(msg) {
    var r = resident();
    var c = OH.cartContents(D.state, r.id);
    if (!c.rows.length) {
      return '<h1 class="script">Your order so far.</h1>' +
        '<p class="sub">Your cart is empty. <a href="#/menu">Browse the menu</a> to get started.</p>';
    }
    /* An item can go 86 while it is sitting in somebody's cart. The engine
       refuses the order at placement and names the dish -- correct, but on its
       own it is a dead end: the resident reads an error and has to work out
       which line to remove. So the line says so, and one button clears them. */
    var dead = c.rows.filter(function (row) { return row.is86; });
    var deadNotice = dead.length
      ? '<div class="notice">' +
        (dead.length === 1
          ? '<strong>' + esc(dead[0].name) + '</strong> has just come off the menu'
          : '<strong>' + dead.length + ' items</strong> have just come off the menu') +
        ' &mdash; the kitchen cannot make ' + (dead.length === 1 ? 'it' : 'them') +
        ' today. <button class="btn danger small" data-act="drop86">Remove ' +
        (dead.length === 1 ? 'it' : 'them') + ' and carry on</button></div>'
      : '';
    var rows = c.rows.map(function (row) {
      return '<div class="mrow' + (row.is86 ? ' gone' : '') + '"><div class="info">' +
        (row.is86 ? '<div class="goneflag">No longer available today</div>' : '') +
        '<span class="name">' + esc(row.name) +
        '</span> &times; ' + row.qty +
        (row.selectionText ? '<div class="desc">' + esc(row.selectionText) + '</div>' : '') +
        '</div><div class="buy"><div class="price">' +
        money(row.priceCents * row.qty) + '</div>' +
        '<button class="btn quiet small" data-act="remove" data-item="' + row.itemId +
        '" data-selkey="' + esc(row.selectionKey) + '">Remove one</button></div></div>';
    }).join('');
    var fee = OH.DELIVERY_FEE_CENTS;
    return '<h1 class="script">Your order so far.</h1>' +
      (msg ? '<div class="notice">' + esc(msg) + '</div>' : '') +
      deadNotice +
      '<p class="sub">From <strong>' + esc(c.rows[0].venueName) + '</strong></p>' + rows +
      /* THE HEADLINE TOTAL FOLLOWS THE FULFILMENT YOU PICKED. Delivery is
         pre-selected, and this line used to print the items-only figure -- so
         the biggest number on the page was $5.50 under what the account would
         actually be charged, and it did not move when you switched to pickup.
         It is the last number a resident reads before committing, so it has
         to be the one they will be billed. */
      '<p style="font-size:1.3rem;margin:1rem 0"><strong id="carttotal">Total: ' +
      money(c.total + fee) + '</strong> <span class="sub" id="cartbasis">' +
      'including ' + money(fee) + ' delivery &mdash; charged to your dining ' +
      'account, no payment needed now</span></p>' +
      '<div id="cartafter">' + afterThisOrder(c.total + fee) + '</div>' +
      '<form data-form="place"><h2>How would you like it?</h2>' +
      '<p><label class="radio"><input type="radio" name="ful" value="delivery" checked> ' +
      'Deliver to my apartment <span class="sub">(adds a ' + money(fee) + ' delivery fee)</span></label>' +
      '<label class="radio"><input type="radio" name="ful" value="pickup"> ' +
      'I’ll pick it up <span class="sub">(no fee)</span></label></p>' +
      '<p class="sub" style="font-size:1.05rem">Delivered: <strong>' + money(c.total + fee) +
      '</strong> &nbsp;&middot;&nbsp; Picked up: <strong>' + money(c.total) + '</strong></p>' +
      /* WHEN WOULD YOU LIKE IT? Colin, 2026-08-22. The times come from the
         venue's own hours, so the page cannot offer a 7pm delivery from a
         kitchen that shut at six, and the first one is far enough out for
         the kitchen to actually make it. */
      '<h2>When would you like it?</h2>' +
      '<p><label class="radio"><input type="radio" name="when" value="asap" checked> ' +
      'As soon as it is ready</label>' +
      '<label class="radio"><input type="radio" name="when" value="at"> ' +
      'At a particular time</label></p>' +
      '<label for="attime">Time</label>' +
      '<select id="attime">' +
      OH.timeSlots(OH.venueBySlug(D.state, 'dining'), new Date()).map(function (sl) {
        return '<option value="' + esc(sl.value) + '">' + esc(sl.label) + '</option>';
      }).join('') + '</select>' +
      '<label for="note">Anything the kitchen should know? (optional)</label>' +
      '<textarea id="note" rows="2" maxlength="300" placeholder="e.g. dressing on the side, please"></textarea>' +
      '<p style="margin-top:1rem"><button class="btn accent" type="submit">Place my order</button> ' +
      '<a class="btn quiet" href="#/menu">Keep browsing</a></p></form>';
  }

  /* What this order leaves. Only shown when we actually know the allowance;
     silence beats a number we cannot stand behind. */
  /* Takes the TOTAL AS IT WILL BE CHARGED -- fee already included by the
     caller. It used to add the delivery fee itself, which made it impossible
     to state the pickup figure without double-counting. */
  function afterThisOrder(chargeTotal) {
    var a = OH.allowanceState(D.state, D.session.residentId, monthNow());
    if (!a.known) return '';
    var left = Math.max(0, a.remaining - chargeTotal);
    return '<p class="sub">This order leaves <strong>' + money(left) +
      '</strong> of your allowance for the month <span class="basis">(' +
      esc(a.basis) + ')</span>.</p>';
  }

  function viewOrder(orderId) {
    var o = OH.orderById(D.state, orderId);
    if (!o) return '<p>No such order. <a href="#/orders">Back to my orders</a></p>';
    /* AN ORDER BELONGS TO SOMEBODY. app.py checks this at three routes and
       the browser port checked it at none, so typing #/order/1 showed another
       resident's order in full -- their name, their dishes, their total -- and
       the Cancel button on it worked, posting a reversal against THEIR
       account. Same answer as a missing order: this resident has no such
       order, because from where they are standing that is the truth. */
    if (o.residentId !== D.session.residentId) {
      return '<p>No such order. <a href="#/orders">Back to my orders</a></p>';
    }
    var r = OH.residentById(D.state, o.residentId);
    var flow = ['RECEIVED', 'PREPARING', o.fulfillment === 'delivery' ? 'OUT' : 'READY', 'COMPLETED'];
    var reached = flow.indexOf(o.status);
    var labelsText = { RECEIVED: 'Received', PREPARING: 'In the kitchen',
                       READY: 'Ready for pickup', OUT: 'On its way', COMPLETED: 'Complete' };
    var steps = o.status === 'CANCELLED' ? '' :
      '<ol class="steps">' + flow.map(function (s, i) {
        var cls = i < reached ? 'done' : (i === reached ? 'now' : '');
        return '<li class="' + cls + '">' + labelsText[s] + '</li>';
      }).join('') + '</ol>';
    var items = o.items.map(function (i) {
      return '<div class="mrow"><div class="info">' + esc(i.name) + ' &times; ' + i.qty +
        (i.selectionText ? '<div class="desc">' + esc(i.selectionText) + '</div>' : '') +
        '</div><div class="price">' + money(i.priceCents * i.qty) + '</div></div>';
    }).join('');
    if (o.feeCents) {
      items += '<div class="mrow"><div class="info">Delivery to your apartment</div>' +
        '<div class="price">' + money(o.feeCents) + '</div></div>';
    }
    return '<h1 class="script">Thank you — order #' + o.id + ' is in.</h1>' +
      '<p class="sub">Oak Hammock Dining Room &middot; ' +
      (o.fulfillment === 'delivery' ? 'Delivering to apartment ' + esc(r.apartment) : 'Pickup') +
      ' &middot; placed ' + esc(o.createdAt.replace('T', ' at ')) +
      (o.wantedAt ? ' &middot; <strong>for ' + esc(OH.prettyTime(o.wantedAt)) +
        '</strong>' : ' &middot; as soon as it is ready') + '</p>' +
      '<div class="notice calm" style="font-size:1.2rem">' + OH.STATUS_LABEL[o.status] + '</div>' +
      steps + '<h2>What you ordered</h2>' + items +
      '<p style="font-size:1.15rem"><strong>Total billed to your apartment: ' +
      money(OH.orderTotal(o)) + '</strong></p>' +
      (o.status === 'RECEIVED'
        ? '<p><button class="btn danger" data-act="cancel" data-order="' + o.id +
          '">Cancel this order</button> <span class="sub">You can cancel until the kitchen starts.</span></p>'
        : '') +
      '<p><a class="btn quiet" href="#/orders">All my orders</a> ' +
      '<a class="btn primary" href="#/menu">Order something else</a></p>';
  }

  function viewOrders(msg) {
    var r = resident();
    var orders = OH.residentOrders(D.state, r.id);
    var mtd = OH.residentMonthTotal(D.state, r.id, monthNow());
    var rows = orders.map(function (o) {
      return '<tr><td>#' + o.id + '</td><td>' + esc(o.createdAt.replace('T', ' ')) +
        '</td><td>' + OH.STATUS_LABEL[o.status] + '</td><td class="num">' +
        money(OH.orderTotal(o)) + '</td><td><a class="btn quiet small" href="#/order/' + o.id +
        '">View</a> ' + (o.status === 'COMPLETED'
          ? '<button class="btn primary small" data-act="reorder" data-order="' + o.id +
            '">Order again</button>' : '') + '</td></tr>';
    }).join('');
    return '<h1 class="script">Your orders.</h1>' +
      '<p class="sub">Dining charges for ' + monthNow() + ' so far: <strong>' + money(mtd) +
      '</strong> — billed to apartment ' + esc(r.apartment) + ' on your monthly statement.</p>' +
      (msg ? '<div class="notice">' + esc(msg) + '</div>' : '') +
      (orders.length
        ? '<div style="overflow-x:auto"><table class="plain"><tr><th>Order</th><th>Placed</th>' +
          '<th>Status</th><th></th><th></th></tr>' + rows + '</table></div>'
        : '<p>No orders yet. <a href="#/menu">Let’s fix that.</a></p>');
  }

  /* --------------------------------------------------------- staff views */

  function viewStaffLogin(msg) {
    return '<h1 class="script">Dining staff sign-in.</h1>' +
      (msg ? '<div class="notice">' + esc(msg) + '</div>' : '') +
      '<form data-form="stafflogin"><label for="pw">Team passphrase</label>' +
      '<input type="password" id="pw">' +
      '<p style="margin-top:1rem"><button class="btn primary" type="submit">Sign in</button></p></form>' +
      '<p class="sub">Residents: <a href="#/">order here instead</a>. ' +
      '(Demo passphrase: <strong>oakhammock</strong>)</p>';
  }

  function viewStaffQueue() {
    var orders = OH.activeOrders(D.state);
    var today = (function (d) {
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) +
        '-' + ('0' + d.getDate()).slice(-2);
    }(new Date()));
    var counts = {};
    D.state.orders.forEach(function (o) {
      if (o.createdAt.slice(0, 10) === today) counts[o.status] = (counts[o.status] || 0) + 1;
    });
    var countLine = Object.keys(counts).map(function (s) {
      return '<strong>' + OH.STATUS_LABEL[s] + '</strong> ' + counts[s];
    }).join(' &middot; ') || 'no orders yet today';
    var cards = orders.map(function (o) {
      var r = OH.residentById(D.state, o.residentId);
      var lines = o.items.map(function (i) {
        return '<li>' + esc(i.name) + ' &times; ' + i.qty +
          (i.selectionText ? '<br><span class="meta">' + esc(i.selectionText) + '</span>' : '') +
          '</li>';
      }).join('');
      var label = o.status === 'RECEIVED' ? 'Start preparing'
        : (o.status === 'PREPARING' && o.fulfillment === 'pickup') ? 'Mark ready'
        : o.status === 'PREPARING' ? 'Send it out' : 'Mark complete';
      return '<div class="qcard ' + o.status + '"><h3>#' + o.id + ' &middot; ' +
        (o.fulfillment === 'delivery' ? 'DELIVER to ' + esc(r.apartment) : 'PICKUP') + '</h3>' +
        '<div class="meta">' + esc(r.name) + ' &middot; apt ' + esc(r.apartment) +
        ' &middot; placed ' + esc(o.createdAt.slice(11, 16)) +
        (o.wantedAt ? ' &middot; <strong>WANTED ' + esc(OH.prettyTime(o.wantedAt)) +
          '</strong>' : '') + ' &middot; ' +
        money(OH.orderTotal(o)) + '</div><ul>' + lines + '</ul>' +
        (o.note ? '<div class="notice" style="margin:.4rem 0">Note: ' + esc(o.note) + '</div>' : '') +
        '<div class="meta" style="margin:.3rem 0"><strong>' + OH.STATUS_LABEL[o.status] + '</strong></div>' +
        '<button class="btn accent small" data-act="advance" data-order="' + o.id + '">' + label + '</button> ' +
        '<button class="btn danger small" data-act="staffcancel" data-order="' + o.id + '">Cancel</button>' +
        '</div>';
    }).join('');
    return staffTabs('queue') + '<h1 class="script">The kitchen board.</h1>' +
      '<p class="sub">Today so far: ' + countLine + '</p>' +
      '<div class="q">' + (cards || '<p>Queue is clear. ☕</p>') + '</div>';
  }

  /* TODAY'S LINE UP -- the kitchen's own screen.
     Colin, 2026-08-22: "allows us to change [the rotating items]. NOT TO ADD
     NEW BUT TO CHANGE THE CURRENT." So every row here edits something that
     already exists; there is no "add" control anywhere on the page, and the
     engine refuses an edit to anything without a slot. */
  var LINEUP_ORDER = [
    { key: 'chef_special_1', label: 'Chef Special 1' },
    { key: 'chef_special_2', label: 'Chef Special 2' },
    { key: 'soup_daily', label: 'Soup du Jour' },
    { key: 'soup_week', label: 'Vegetarian Soup of the Week' },
    { key: 'cold_soup', label: 'Cold Soup', note: 'Wednesdays only' },
    { key: 'healthy_choice', label: 'Chef’s Healthy Choice' },
    { key: 'fresh_catch', label: 'Fresh Catch' },
    { key: 'fish_sandwich', label: 'Fish Sandwich' },
    { key: 'sandwich_of_week', label: 'Sandwich of the Week' },
    { key: 'dessert_daily', label: 'Daily Dessert' },
    { key: 'dessert_premium', label: 'Premium Dessert' }
  ];
  /* Slots with no dish of their own -- these are today's WORDING for things
     that appear inside other items (the sides picker literally offers
     "Vegetable of the moment"). */
  var LINEUP_TEXT_SLOTS = [
    { key: 'quiche_meat', label: 'Quiche (meat)', hint: 'e.g. ham and Swiss' },
    { key: 'quiche_veg', label: 'Quiche (vegetarian)', hint: 'e.g. spinach and feta' },
    { key: 'veg_moment', label: 'Vegetable of the moment', hint: 'e.g. roasted asparagus' },
    { key: 'starch_moment', label: 'Starch of the moment', hint: 'e.g. potato latkes' },
    { key: 'rolls', label: 'Rolls', hint: 'e.g. today’s sourdough' }
  ];

  function viewStaffLineup(msg) {
    var today = OH.dayName(new Date());
    var rows = LINEUP_ORDER.map(function (slot) {
      var items = OH.slotOccupants(D.state, slot.key);
      if (!items.length) return '';
      return '<div class="card" style="margin-bottom:1rem">' +
        '<h3 style="margin:0 0 .2rem">' + esc(slot.label) +
        (slot.note ? ' <span class="sub">(' + esc(slot.note) +
           (today === 'Wednesday' ? ' — showing today' : ' — not showing today') +
           ')</span>' : '') + '</h3>' +
        items.map(function (it) {
          return '<form data-form="lineup" data-item="' + it.id + '">' +
            '<label>Dish</label>' +
            '<input type="text" name="ln-name" maxlength="80" value="' + esc(it.name) + '">' +
            '<label>Description</label>' +
            '<input type="text" name="ln-desc" maxlength="300" value="' +
              esc(it.description || '') + '">' +
            '<label>Price (dollars)</label>' +
            '<input type="text" name="ln-price" inputmode="decimal" value="' +
              (it.priceCents / 100).toFixed(2) + '">' +
            '<p style="margin:.5rem 0 0"><button class="btn primary small" type="submit">' +
            'Save</button> <span class="sub">' +
            (it.is86 ? 'currently 86’d' : 'on the menu now') + '</span></p>' +
            '</form>';
        }).join('') + '</div>';
    }).join('');

    var texts = LINEUP_TEXT_SLOTS.map(function (slot) {
      return '<form data-form="lineuptext" data-slot="' + esc(slot.key) + '" ' +
        'style="display:flex;gap:.5rem;align-items:flex-end;margin-bottom:.6rem;flex-wrap:wrap">' +
        '<span style="flex:1 1 14rem"><label>' + esc(slot.label) + '</label>' +
        '<input type="text" name="lt-value" maxlength="140" placeholder="' +
        esc(slot.hint) + '" value="' + esc(OH.lineupText(D.state, slot.key)) + '"></span>' +
        '<button class="btn primary small" type="submit">Save</button></form>';
    }).join('');

    return '<h1 class="script">Today’s line up.</h1>' +
      '<p class="sub">Change what today’s rotating items <em>are</em>. Everything ' +
      'here already exists on the menu — this screen never adds a dish, it ' +
      'replaces what is in each slot, so the allergen notes and the option ' +
      'pickers stay attached to it.</p>' +
      (msg ? '<div class="notice">' + esc(msg) + '</div>' : '') +
      '<p class="sub">Today is <strong>' + esc(today) + '</strong>.</p>' +
      rows +
      '<h2>Today’s wording</h2>' +
      '<p class="sub">Not dishes on their own — this is what the menu means by ' +
      '“vegetable of the moment” and the like, wherever it says it.</p>' +
      texts;
  }

  function viewStaffMenu() {
    var rows = D.state.items.map(function (it) {
      return '<tr' + (it.is86 ? ' style="opacity:.55"' : '') + '><td>' + esc(it.name) +
        (it.isSpecial ? ' <span class="tag">SPECIAL</span>' : '') + '</td><td>' +
        esc(it.mealPeriod) + '</td><td class="num">' + money(it.priceCents) + '</td><td>' +
        (it.is86 ? '<strong style="color:#98283C">86’d</strong>' : 'Available') + '</td><td>' +
        '<button class="btn ' + (it.is86 ? 'primary' : 'danger') + ' small" data-act="toggle86" ' +
        'data-item="' + it.id + '">' + (it.is86 ? 'Bring back' : '86 it') + '</button></td></tr>';
    }).join('');
    return staffTabs('menu') + '<h1 class="script">Menu manager.</h1>' +
      '<p class="sub">86 an item and it disappears from resident menus immediately; un-86 brings it back.</p>' +
      '<h2>Add today’s special</h2>' +
      '<form data-form="special" class="card" style="max-width:34rem">' +
      '<label>Meal period</label><select id="sp-period"><option>Breakfast</option>' +
      /* STRAIGHT apostrophe, matching menu_data.py exactly. This option was
         typed curly, so the kitchen's own form filed every new special under
         a heading that merely looked like the real one. groupKey now folds
         them together anyway -- belt and braces, because the next person to
         type a heading will not be thinking about Unicode either. */
      '<option>Lunch &amp; Dinner</option><option selected>Today\'s Specials</option></select>' +
      '<label>Name</label><input type="text" id="sp-name" placeholder="e.g. Shrimp &amp; Grits">' +
      '<label>Price (dollars)</label><input type="text" id="sp-price" placeholder="e.g. 14.50">' +
      '<label>Description (optional)</label><input type="text" id="sp-desc">' +
      '<p style="margin-top:.8rem"><button class="btn accent" type="submit">Add special</button></p></form>' +
      '<h2>All items</h2><div style="overflow-x:auto"><table class="plain">' +
      '<tr><th>Item</th><th>Period</th><th class="num">Price</th><th>Status</th><th></th></tr>' +
      rows + '</table></div>';
  }

  function viewStaffBilling() {
    var month = D.session.billingMonth || monthNow();
    var rows;
    try { rows = OH.monthCharges(D.state, month); }
    catch (e) { rows = []; }
    var total = rows.reduce(function (a, r) { return a + r.amountCents; }, 0);
    var body = rows.map(function (r) {
      return '<tr><td>' + esc(r.apartment) + '</td><td>' + esc(r.residentName) + '</td><td>' +
        esc(r.createdAt.slice(0, 10)) + '</td><td>#' + r.orderId + '</td><td>' +
        esc(r.itemSummary) + '</td><td class="num">' + money(r.amountCents) + '</td></tr>';
    }).join('') || '<tr><td colspan="6">No charges in this month.</td></tr>';
    return staffTabs('billing') + '<h1 class="script">Monthly billing export.</h1>' +
      '<p class="sub">Charges post when an order is placed and are voided if it is cancelled. ' +
      'The CSV total is computed from exactly the rows it lists.</p>' +
      '<form data-form="billmonth" class="inline"><label for="bm">Month</label> ' +
      '<input type="month" id="bm" value="' + esc(month) + '"> ' +
      '<button class="btn primary" type="submit">Show</button> ' +
      '<button class="btn accent" data-act="csv" type="button">Copy CSV for invoicing</button></form>' +
      '<h2>' + esc(month) + ' — ' + rows.length + ' charge(s), total ' + money(total) + '</h2>' +
      '<div style="overflow-x:auto"><table class="plain"><tr><th>Apartment</th><th>Resident</th>' +
      '<th>Date</th><th>Order</th><th>Items</th><th class="num">Amount</th></tr>' + body + '</table></div>';
  }

  function staffTabs(here) {
    function tab(slug, label) {
      return '<a class="btn ' + (here === slug ? 'primary' : 'quiet') + ' small" href="#/staff/' +
        slug + '">' + label + '</a> ';
    }
    return '<p>' + tab('queue', 'Queue') + tab('menu', 'Menu Manager') + tab('billing', 'Billing') + '</p>';
  }

  /* ------------------------------------------------------------- router */

  function currentView() {
    var h = location.hash || '#/';
    var r = resident();
    if (h.indexOf('#/staff') === 0) {
      if (!D.session.staff) return viewStaffLogin();
      if (h === '#/staff/lineup') return viewStaffLineup();
      if (h === '#/staff/menu') return viewStaffMenu();
      if (h === '#/staff/billing') return viewStaffBilling();
      return viewStaffQueue();
    }
    if (!r) {
      /* These two are the pre-sign-in steps, so they must be reachable HERE,
         inside the not-signed-in branch. Placing them after it made the route
         exist and never run. */
      if (h === '#/which' && D.session.ambiguous) return viewWhich();
      if (h === '#/confirm' && D.session.pendingId) return viewConfirm();
      return viewSignin();
    }
    if (h === '#/menu') return viewMenu();
    if (h.indexOf('#/choose/') === 0) return viewChoose(parseInt(h.slice(9), 10));
    if (h === '#/chat') return viewChat();
    if (h === '#/cart') return viewCart();
    if (h === '#/orders') return viewOrders();
    if (h.indexOf('#/order/') === 0) return viewOrder(parseInt(h.slice(8), 10));
    return viewVenues();
  }

  function render() {
    document.getElementById('hdr').innerHTML = header();
    $app.classList.remove('fade-in');
    $app.innerHTML = currentView() + footer();
    void $app.offsetWidth;            // restart the entrance transition
    $app.classList.add('fade-in');
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', render);

  /* ------------------------------------------------------------ actions */

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    ev.preventDefault();
    var act = el.dataset.act;
    try {
      if (act === 'reset') { resetDemo(); toast('Demo reset — fresh start.'); return; }
      if (act === 'signout') { D.session.residentId = null; D.session.pendingId = null; save(); go('#/'); return; }
      if (act === 'staffout') { D.session.staff = false; save(); go('#/'); return; }
      if (act === 'confirm') { D.session.residentId = D.session.pendingId; D.session.pendingId = null; save(); go('#/venues'); return; }
      if (act === 'add') {
        OH.cartAdd(D.state, D.session.residentId, parseInt(el.dataset.item, 10));
        save(); render(); toast('Added to your cart');
        return;
      }
      if (act === 'which') {
        D.session.pendingId = parseInt(el.dataset.id, 10);
        D.session.ambiguous = null;
        save(); go('#/confirm'); return;
      }
      if (act === 'choose') { go('#/choose/' + el.dataset.item); return; }
      if (act === 'drop86') {
        var mine = OH.cartContents(D.state, D.session.residentId).rows;
        mine.filter(function (row) { return row.is86; }).forEach(function (row) {
          for (var n = 0; n < row.qty; n++) {
            OH.cartRemove(D.state, D.session.residentId, row.itemId, row.selectionKey);
          }
        });
        save(); render(); toast('Removed. The rest of your order is unchanged.');
        return;
      }
      if (act === 'chat-pick') {
        chatHandle(el.dataset.value); save(); render(); return;
      }
      if (act === 'chat-again') {
        /* "The usual" -- refill from their own past order. The engine already
           does this, and it REFUSES an order that is not theirs, so the same
           ownership guard covers the chat path for free. Items that went 86
           since are named rather than quietly left out. */
        var skippedAgain;
        try {
          skippedAgain = OH.reorderIntoCart(D.state, D.session.residentId,
                                            parseInt(el.dataset.order, 10));
        } catch (err) {
          say('bot', '', 'Sorry — ' + esc(err.message) + '.');
          save(); render(); return;
        }
        say('you', 'Yes, the same again');
        say('bot', '', skippedAgain.length
          ? 'Back in your cart, except <strong>' + esc(skippedAgain.join(', ')) +
            '</strong> — the kitchen is not making that today. ' +
            '<a href="#/cart">Review and send it</a>.'
          : 'Done — it is back in your cart. <a href="#/cart">Review and send it</a>.');
        save(); render(); return;
      }
      if (act === 'chat-item') {
        var picked = OH.itemById(D.state, parseInt(el.dataset.item, 10));
        say('you', picked.name);
        D.session.pending = { itemId: picked.id, itemName: picked.name,
                              selections: {}, asking: null, ready: false };
        askNext(); save(); render(); return;
      }
      if (act === 'chat-cancel') {
        D.session.pending = null;
        say('bot', 'Started over. What would you like?');
        save(); render(); return;
      }
      if (act === 'chat-confirm') {
        var pc = D.session.pending;
        /* The engine is the authority even here: if the proposal is somehow
           incomplete, or the dish went 86 mid-conversation, this throws and
           the chat says so rather than adding a plate nobody can cook. */
        /* Quantity: the engine adds one line per call, so ask it n times. */
        var n = Math.max(1, Math.min(20, pc.qty || 1));
        for (var q = 0; q < n; q++) {
          OH.cartAdd(D.state, D.session.residentId, pc.itemId, pc.selections, pc.note || '');
        }
        D.session.pending = null;
        say('bot', '', 'Added. Anything else? When you are ready, ' +
          '<a href="#/cart">review and place your order</a>.');
        save(); render(); toast('Added to your order');
        return;
      }

      if (act === 'remove') {
        OH.cartRemove(D.state, D.session.residentId, parseInt(el.dataset.item, 10),
                      el.dataset.selkey);
        save(); render(); return;
      }
      if (act === 'cancel') {
        /* The resident-facing cancel. Guarded the same way viewOrder is: the
           button only renders on your own order, but a button is not a
           permission check -- the handler is. */
        var toCancel = OH.orderById(D.state, parseInt(el.dataset.order, 10));
        if (!toCancel || toCancel.residentId !== D.session.residentId) {
          toast('That is not one of your orders.');
          return;
        }
        OH.cancelOrder(D.state, toCancel.id, false, new Date());
        save(); render(); toast('Order cancelled — nothing will be billed.');
        return;
      }
      if (act === 'reorder') {
        var skipped;
        try {
          skipped = OH.reorderIntoCart(D.state, D.session.residentId,
                                       parseInt(el.dataset.order, 10));
        } catch (err) {
          /* The engine now refuses an order it cannot find or that is not
             this resident's, rather than emptying the cart and reporting
             success. Say so; the cart they were building is still there. */
          toast('Sorry — ' + err.message + '. Your cart is untouched.');
          return;
        }
        save();
        if (skipped.length) toast('Back in your cart — except ' + skipped.join(', ') + ' (not available today)');
        else toast('Back in your cart.');
        go('#/cart');
        return;
      }
      if (act === 'advance') {
        OH.advanceStatus(D.state, parseInt(el.dataset.order, 10), new Date());
        save(); render(); return;
      }
      if (act === 'staffcancel') {
        OH.cancelOrder(D.state, parseInt(el.dataset.order, 10), true, new Date());
        save(); render(); toast('Cancelled; the charge is voided.');
        return;
      }
      if (act === 'toggle86') {
        var it = OH.itemById(D.state, parseInt(el.dataset.item, 10));
        it.is86 = !it.is86;
        save(); render();
        toast(it.is86 ? it.name + ' is 86’d — hidden from residents.' : it.name + ' is back on the menu.');
        return;
      }
      if (act === 'csv') {
        var csv = OH.monthCsv(D.state, D.session.billingMonth || monthNow());
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(csv).then(function () {
            toast('CSV copied — paste straight into the invoice run.');
          }, function () { toast('Could not reach the clipboard in this browser.'); });
        } else { toast('Clipboard is unavailable in this browser.'); }
        return;
      }
    } catch (e) {
      toast(e.message);
      render();
    }
  });

  /* THE BUTTON HAS TO QUOTE THE PRICE YOU ARE ACTUALLY ABOUT TO PAY. It read
     the base price and never moved, so a resident adding $7.50 of salmon to
     an $8.00 stir fry pressed a button that said "Add to my order · $8.00"
     and was billed $15.50. The chat path already recomputes; the picker did
     not. Delegated, so it survives every re-render. */
  document.addEventListener('change', function (ev) {
    /* Switching delivery/pickup moves the headline total and the allowance
       projection with it, in place -- re-rendering the whole cart here would
       throw away whatever the resident had typed in the kitchen note. */
    if (ev.target && ev.target.name === 'ful') {
      var rr = resident();
      if (rr) {
        var cc = OH.cartContents(D.state, rr.id);
        var isDel = ev.target.value === 'delivery';
        var f = isDel ? OH.DELIVERY_FEE_CENTS : 0;
        var tot = document.getElementById('carttotal');
        var basis = document.getElementById('cartbasis');
        var after = document.getElementById('cartafter');
        if (tot) tot.innerHTML = 'Total: ' + money(cc.total + f);
        if (basis) {
          basis.innerHTML = (isDel ? 'including ' + money(OH.DELIVERY_FEE_CENTS) +
            ' delivery &mdash; ' : 'no delivery fee &mdash; ') +
            'charged to your dining account, no payment needed now';
        }
        if (after) after.innerHTML = afterThisOrder(cc.total + f);
      }
      return;
    }

    var form = ev.target && ev.target.closest && ev.target.closest('form[data-form="choose"]');
    if (!form) return;
    var it = OH.itemById(D.state, parseInt(form.dataset.item, 10));
    if (!it) return;
    var sel = {};
    form.querySelectorAll('.optgroup').forEach(function (fs) {
      var picked = [];
      fs.querySelectorAll('input:checked').forEach(function (inp) { picked.push(inp.value); });
      sel[fs.dataset.label] = picked;
    });
    var btn = form.querySelector('button[type="submit"]');
    if (btn) {
      btn.innerHTML = 'Add to my order &middot; ' +
        money(it.priceCents + OH.extrasCents(it, sel));
    }
    /* Clear the "needs" marker as soon as they answer it, rather than making
       them submit again to find out they fixed it. */
    form.querySelectorAll('.optgroup.needs').forEach(function (fs) {
      if ((sel[fs.dataset.label] || []).length) fs.classList.remove('needs');
    });
  });

  document.addEventListener('submit', function (ev) {
    var form = ev.target.closest('[data-form]');
    if (!form) return;
    ev.preventDefault();
    var kind = form.dataset.form;
    try {
      if (kind === 'signin') {
        var apt = document.getElementById('apt').value;
        var all = OH.findResidents(D.state, apt);
        if (all.length > 1) {
          D.session.ambiguous = all.map(function (x) { return x.id; });
          D.session.ambiguousFor = apt.trim();
          save(); go('#/which'); return;
        }
        var r = all.length === 1 ? all[0] : null;
        if (!r) {
          $app.innerHTML = viewSignin('We couldn’t find apartment “' + apt +
            '”. Double-check the number, or call the front desk at 352-548-1000.') + footer();
          return;
        }
        D.session.pendingId = r.id; save(); go('#/confirm'); return;
      }
      if (kind === 'choose') {
        var itemId = parseInt(form.dataset.item, 10);
        var sel = {};
        form.querySelectorAll('.optgroup').forEach(function (fs) {
          var picked = [];
          fs.querySelectorAll('input:checked').forEach(function (inp) {
            picked.push(inp.value);
          });
          sel[fs.dataset.label] = picked;
        });
        /* Name the FIRST unanswered required group, mark it, and scroll to
           it. A toast is the wrong control here: it disappears, and the
           resident is left looking at a form that did nothing. */
        var missing = null;
        form.querySelectorAll('.optgroup').forEach(function (fs) {
          fs.classList.remove('needs');
          if (fs.dataset.type === 'choice' && !(sel[fs.dataset.label] || []).length) {
            fs.classList.add('needs');
            if (!missing) missing = fs;
          }
        });
        if (missing) {
          missing.scrollIntoView({ block: 'center', behavior: 'smooth' });
          toast('Please choose ' + missing.dataset.label.toLowerCase() + '.');
          return;
        }
        var extra = (document.getElementById('itemnote') || {}).value || '';
        OH.cartAdd(D.state, D.session.residentId, itemId, sel, extra.trim());
        save(); go('#/menu');
        toast('Added, just how you like it.');
        return;
      }
      if (kind === 'chat') {
        var box = document.getElementById('msg');
        var msg = (box.value || '').trim();
        if (!msg) return;
        chatHandle(msg);
        save(); render();
        /* scrollIntoView on the last bubble, not scrollTop on the box: with a
           mobile keyboard open the box is a sliver and a reply can land out of
           sight, which reads as "nothing happened". */
        var bubs = document.querySelectorAll('#chatbox .bub');
        if (bubs.length) {
          bubs[bubs.length - 1].scrollIntoView({ block: 'end' });
        }
        var again = document.getElementById('msg');
        if (again) again.focus();
        return;
      }
      if (kind === 'place') {
        var ful = form.querySelector('input[name="ful"]:checked').value;
        var note = document.getElementById('note').value;
        /* Blank means as soon as it is ready. The engine checks any chosen
           time against the slots it actually offered, so a stale page cannot
           book a delivery for after closing. */
        var whenSel = form.querySelector('input[name="when"]:checked');
        var wantAt = (whenSel && whenSel.value === 'at' &&
                      document.getElementById('attime'))
          ? document.getElementById('attime').value : '';
        var oid;
        try {
          oid = OH.placeOrder(D.state, D.session.residentId, ful, note, new Date(), wantAt);
        } catch (err) { toast(err.message); return; }
        save(); go('#/order/' + oid); return;
      }
      if (kind === 'stafflogin') {
        if (document.getElementById('pw').value === STAFF_PASSPHRASE) {
          D.session.staff = true; save(); go('#/staff/queue');
        } else {
          $app.innerHTML = viewStaffLogin('That’s not the team passphrase.') + footer();
        }
        return;
      }
      if (kind === 'special') {
        var name = document.getElementById('sp-name').value.trim();
        var priceTxt = document.getElementById('sp-price').value.trim().replace(/^\$/, '');
        var cents = Math.round(parseFloat(priceTxt) * 100);
        if (!name || !(cents > 0)) { toast('A special needs a name and a price.'); return; }
        D.state.items.push({
          id: D.state.nextItemId++, venueSlug: 'dining',
          mealPeriod: document.getElementById('sp-period').value,
          section: 'Daily Specials', name: name,
          description: document.getElementById('sp-desc').value.trim(),
          priceCents: cents, tags: [], is86: false, isSpecial: true,
          sort: D.state.items.length
        });
        save(); render(); toast('“' + name + '” is on the menu.');
        return;
      }
      if (kind === 'lineup') {
        /* CHANGE, never add. The engine refuses anything without a slot, so
           this cannot quietly create a dish even if the form is tampered
           with. A blank price is left alone rather than read as zero. */
        var lid = parseInt(form.dataset.item, 10);
        var lname = form.querySelector('[name="ln-name"]').value;
        var ldesc = form.querySelector('[name="ln-desc"]').value;
        var lpriceTxt = form.querySelector('[name="ln-price"]').value.trim().replace(/^\$/, '');
        var patch = { name: lname, description: ldesc };
        if (lpriceTxt !== '') {
          var cents = Math.round(parseFloat(lpriceTxt) * 100);
          if (!isFinite(cents)) { toast('That price is not a number.'); return; }
          patch.priceCents = cents;
        }
        try { OH.updateSlotItem(D.state, lid, patch); }
        catch (err) { toast(err.message); return; }
        save(); render();
        toast('Updated — residents see it straight away.');
        return;
      }
      if (kind === 'lineuptext') {
        OH.setLineupText(D.state, form.dataset.slot,
                         form.querySelector('[name="lt-value"]').value);
        save(); render(); toast('Saved.');
        return;
      }
      if (kind === 'billmonth') {
        D.session.billingMonth = document.getElementById('bm').value || monthNow();
        save(); render(); return;
      }
    } catch (e) {
      toast(e.message);
      render();
    }
  });

  render();
}());

</script>

</body>
</html>
