       "fish" in its name, which is not what was asked. Half this menu
       rotates daily, so asking what is up today is ordinary. Answered from
       the kitchen's own Line Up, never from a guess. */
    if (WHATS_UP_RE.test(text)) return 'recommend';
    /* "do you have anything cold" is browsing. It came back as an ORDER
       for the Cold Cut Sandwich -- one word of a three-word name, and the
       only other dish sharing that word is Wednesday-only, so on a
       Thursday a shared word behaved like a unique one. */
    if (ANYTHING_RE.test(text)) return 'recommend';
    if (/\b(help|what can you do|how does this work)\b/i.test(text)) return 'help';
    if (/\b(cancel|never mind|nevermind|start over|clear)\b/i.test(text)) return 'reset';
    /* "done" must not fire inside "well done" -- a cook temperature is not a
       request to check out, and treating it as one submits an order the
       resident was still building. Strip the temperature, then look. */
    var t = String(text).replace(/\bwell\s+done\b/gi, ' ');
    if (/\b(done|thats it|that's it|finish|check ?out|place (my )?order)\b/i.test(t)) return 'done';
    if (/\b(menu|what do you have|whats available|what's available|specials?)\b/i.test(text)) return 'menu';
    return 'order';
  }

  /* ------------------------------------------------------------- typos ---
   *
   * "shwarma" and "filet mignonn" came back as "not on today's menu", which is
   * true and unhelpful -- an 80-year-old on a phone keyboard mistypes, and
   * being told the dish does not exist is the wrong answer.
   *
   * THE HOUSE RULE STILL HOLDS: a fuzzy match is a GUESS, and a guess is never
   * rendered as a fact. This never proposes. It ASKS, naming what they typed,
   * and the resident taps the dish. Same treatment
   * /duplicate-customer-finder/ gives its edit-distance pass -- exact match is
   * a fact, near match is a hedged question -- and that is why it is the only
   * tool of its family that never made a false claim.
   */
  function editDistance(a, b) {
    var m = a.length, n = b.length;
    /* THIS EARLY-OUT IS THE REAL CAP, not the `allow` below. Anything further
       apart than two characters returns the sentinel 3, and the caller drops
       every hit that is not under 3 -- so raising `allow` alone changes
       nothing. I proved that by accident: sabotaging `allow` to 4 left the
       suite green because the mutation was INERT, not because the test was
       weak. Loosening this line as well produces 12 false suggestions on the
       real menu and two red tests. If you ever want a looser matcher, this is
       the line, and the false-positive half of the suite is what will stop
       you shipping it. */
    if (Math.abs(m - n) > 2) return 3;
    /* TWO SWAPPED LETTERS ARE ONE SLIP, NOT TWO -- the Damerau term, added
       2026-08-23. "pressed rueben" came back "I do not see that on today's
       menu", on a dish that is right there: plain Levenshtein scores
       rueben/reuben at 2, and six-letter words are only allowed 1. This is
       NOT the same as loosening `allow`, which the comment above rightly
       warns off: it lowers the distance for adjacent-swapped letters only,
       which is the single commonest typing error and cannot pull in an
       unrelated word. The false-positive half of the suite is the check. */
    var prev = [], prev2 = [], cur = [], i, j;
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur[0] = i;
      for (j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1,
                          prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
        if (i > 1 && j > 1 &&
            a.charAt(i - 1) === b.charAt(j - 2) &&
            a.charAt(i - 2) === b.charAt(j - 1)) {
          cur[j] = Math.min(cur[j], prev2[j - 2] + 1);
        }
      }
      for (j = 0; j <= n; j++) { prev2[j] = prev[j]; prev[j] = cur[j]; }
    }
    return prev[n];
  }

  /* Dishes whose name contains a word within an edit or two of something the
     resident typed. Short words are excluded: at four letters a distance of
     two is a different word, not a slip. */
  function nearMisses(state, text) {
    var claimed = optionClaimedWords(state, norm(text));
    var typed = words(text).filter(function (w, i) {
      return isUnplaceable(state, w, i, claimed, words(text)) && w.length >= 4;
    });
    if (!typed.length) return { typed: '', items: [] };

    var hits = [];
    state.items.filter(function (it) { return !it.is86; }).forEach(function (it) {
      var best = 3;
      words(it.name).forEach(function (nw) {
        if (nw.length < 4 || STOP[nw]) return;
        typed.forEach(function (tw) {
          var d = editDistance(tw, nw);
          /* One edit at five letters; two only once the word is long enough
             that two slips still read as obviously the same word. */
          var allow = nw.length >= 7 ? 2 : 1;
          if (d <= allow && d < best) best = d;
        });
      });
      if (best < 3) hits.push({ item: it, d: best });
    });
    hits.sort(function (a, b) { return a.d - b.d; });
    return {
      typed: typed.join(' '),
      items: hits.slice(0, 4).map(function (h) { return h.item; })
    };
  }

  /* -------------------------------------------------------- item matching */

  /* Singular/plural-tolerant word search. Returns the index of ' word ' in t
     the way indexOf would, but also accepting the other number: the menu says
     "Ronnoco Coffee" and the resident says "two coffees". Only for words long
     enough that a trailing s is a plural rather than the word ("peas"). */
  function findWordish(t, w, from) {
    var at = t.indexOf(' ' + w + ' ', from || 0);
    if (at !== -1) return at;
    /* ABBREVIATIONS. "Eggplant parm extra sauce no cheese crispy" came back
       "I do not see eggplant parm on today's menu" -- on a dish that is on
       the menu, because nobody says "Parmesan". A spoken word that is the
       front of a menu word is the same word: parm/parmesan, tenderloin/
       tender, shawarma/shawar. Four letters minimum, so it stays a shortening
       rather than a coincidence. */
    if (w.length >= 6) {
      var re = new RegExp(' (' + w.slice(0, 4) + '[a-z]*) ');
      var m = re.exec(t.slice(from || 0));
      /* THIS LINE IS THE GUARD, not the slice above -- the slice is only a
         prefilter. The spoken word must be a TRUE PREFIX of the menu word,
         so the rule cannot be widened into a wildcard without ceasing to be
         a prefix at all. Measured: loosening the slice to two characters
         changes exactly one answer on the real menu, and loosening this
         length test to two changes one more ("egg", which was already right
         via the plural rule). Narrow by construction, which is the reason
         "philly" and "mac and cheese" are still not on the menu. */
      if (m && w.indexOf(m[1]) === 0 && m[1].length >= 4) {
        return (from || 0) + m.index;
      }
    }
    if (w.length >= 4) {
      if (!/s$/.test(w)) {
        at = t.indexOf(' ' + w + 's ', from || 0);
        if (at !== -1) return at;
        at = t.indexOf(' ' + w + 'es ', from || 0);
        if (at !== -1) return at;
      } else {
        /* EACH SUFFIX SEPARATELY. Chaining the two replaces turned "pancakes"
           into "pancak" -- /es$/ fires first and eats the "e" -- so a
           resident asking for "a pancake" was told we do not have it. */
        var cands = [w.replace(/s$/, ''), w.replace(/es$/, '')];
        for (var ci = 0; ci < cands.length; ci++) {
          if (cands[ci].length >= 3 && cands[ci] !== w) {
            at = t.indexOf(' ' + cands[ci] + ' ', from || 0);
            if (at !== -1) return at;
          }
        }
      }
    }
    return -1;
  }

  /* "3 filet mignon", "two orders of french toast". The quantity was ignored
     outright, so a resident asking for three got one -- money, quietly. */
  var NUMBER_WORD = {
    one: 1, two: 2, three: 3, four: 4, five: 5, six: 6,
    seven: 7, eight: 8, nine: 9, ten: 10, a: 1, an: 1, couple: 2
  };

  function spokenQuantity(text) {
    var m = /(^|\s)(\d{1,2})\s+(?!oz\b)/.exec(' ' + String(text || '') + ' ');
    if (m) {
      var n = parseInt(m[2], 10);
      if (n >= 1 && n <= 20) return n;
    }
    var ws = words(text);
    for (var i = 0; i < ws.length; i++) {
      if (NUMBER_WORD[ws[i]] && NUMBER_WORD[ws[i]] > 1) return NUMBER_WORD[ws[i]];
    }
    return 1;
  }

  /* HOW MANY DISHES SHARE EACH NAME WORD. This is the difference between
     evidence and a coincidence: "filet" belongs to one dish, "steak" to two,
     "sandwich" to three, "soup" to six. Saying a word only one dish owns is
     as good as naming it; saying a word six dishes share is naming a family.
     Every remaining failure in the corpus was the parser treating the second
     kind as if it were the first. */
  function dishOwners(state) {
    if (state._owners) return state._owners;
    var o = {};
    state.items.forEach(function (it) {
      var seen = {};
      words(it.name).forEach(function (w) {
        if (w.length <= 2 || STOP[w] || seen[w]) return;
        seen[w] = 1;
        o[w] = (o[w] || 0) + 1;
      });
    });
    state._owners = o;
    return o;
  }

  /* Every phrase in the menu's OPTION vocabulary -- side names, cheeses, cook
     temperatures, condiments -- longest first. Cached on the state. */
  function optionPhrases(state) {
    if (state._optPhrases) return state._optPhrases;
    var seen = {};
    state.items.forEach(function (it) {
      (it.options || []).forEach(function (g) {
        g.choices.forEach(function (c) {
          /* No four-word cap. It excluded "Vegetarian (spinach, kale, tomato
             & feta)" -- five words once normalised -- which was the single
             option value out of 156 still able to drag a dish into the
             running. A long phrase matching exactly is STRONGER evidence that
             the resident is naming an option, not weaker. */
          var n = norm((c && c.name !== undefined) ? c.name : c).trim();
          if (n) seen[n] = 1;
        });
      });
    });
    state._optPhrases = Object.keys(seen).sort(function (a, b) {
      return b.length - a.length;
    });
    return state._optPhrases;
  }

  /* Which words of the utterance are already spoken for BY AN OPTION.
     Colin's first message to the live chat was "hamburger cheddar no pickle
     medium with french fries please" and it replied "did you mean French
     Toast?". "French fries" is a SIDE -- an option choice on 24 items -- and
     the dish matcher counted its "french" as half of the dish name "French
     Toast", which was then the only candidate on the entire menu. A word the
     resident spent naming a side is not evidence about the dish. */
  /* Every WORD that appears anywhere in the option vocabulary. Distinct from
     optionPhrases: this catches "fries" from "French fries" and "potatoes"
     from "Mashed potatoes", which is how people actually say a side. */
  function optionWords(state) {
    if (state._optWords) return state._optWords;
    var w = {};
    optionPhrases(state).forEach(function (p) {
      p.split(' ').forEach(function (x) { if (x.length >= 3) w[x] = 1; });
    });
    state._optWords = w;
    return w;
  }

  /* The side they named, in the menu's own words where we can manage it --
     "French fries" reads better back to a resident than "fries". Longest
     phrase wins; falls back to null and the caller uses what they typed. */
  function sidePhrase(state, text) {
    var t = norm(text);
    var phrases = optionPhrases(state);
    /* An exact occurrence, longest first, skipping the HOLD choices -- "no
       mashed potatoes" is not what somebody asking for mashed potatoes wants
       read back to them. */
    for (var i = 0; i < phrases.length; i++) {
      if (phrases[i] && !isHoldChoice(phrases[i]) &&
          t.indexOf(' ' + phrases[i] + ' ') !== -1) {
        return phrases[i];
      }
    }
    /* Otherwise echo WHAT THEY TYPED rather than guessing which menu phrase
       they meant. A bare "fries" could be French fries or home fries, and
       picking one to read back would be inventing a fact about their order
       to make a sentence scan better. */
    var after = /\bsides? of\b\s+(.+)$/i.exec(String(text || ''));
    var src = after ? after[1] : text;
    var ws = words(src).filter(function (w) {
      return w.length >= 3 && !STOP[w] && !FILLER[w];
    });
    return ws.length ? ws.join(' ') : null;
  }

  /* Words that appear in some DISH's own name. */
  function dishNameWords(state) {
    if (state._dishWords) return state._dishWords;
    var d = {};
    state.items.forEach(function (it) {
      words(it.name).forEach(function (w) { if (w.length > 2 && !STOP[w]) d[w] = 1; });
    });
    state._dishWords = d;
    return d;
  }

  function optionClaimedWords(state, t) {
    var claimed = {};
    var phrases = optionPhrases(state);
    var taken = [];
    function free(a, b) {
      for (var k = 0; k < taken.length; k++) {
        if (a < taken[k][1] && b > taken[k][0]) return false;
      }
      return true;
    }
    var dishWords = dishNameWords(state);
    for (var i = 0; i < phrases.length; i++) {
      var n = phrases[i];
      if (!n) continue;
      /* A ONE-WORD OPTION THAT IS ALSO A DISH'S OWN NAME WORD DOES NOT CLAIM.
         "Coffee" is an ice-cream flavour here, so claiming it hid Ronnoco
         Coffee and "a coffee" came back as a side. Multi-word phrases still
         claim -- "French fries" is unambiguously the side, which is the case
         this whole mechanism exists for. */
      if (n.indexOf(' ') === -1 && dishWords[n]) continue;
      var at = t.indexOf(' ' + n + ' ');
      while (at !== -1) {
        if (free(at + 1, at + 1 + n.length)) {
          taken.push([at + 1, at + 1 + n.length]);
          var wi = t.slice(0, at + 1).split(' ').length - 2;
          var parts = n.split(' ');
          for (var k = 0; k < parts.length; k++) claimed[wi + k] = 1;
        }
        at = t.indexOf(' ' + n + ' ', at + 1);
      }
    }
    /* "A SIDE OF fries" uses "side" as a common noun, not as the dish Side
       Salad -- which is what it matched, so somebody asking for chips was
       offered a salad. Claim it so it cannot be the evidence for a dish.
       Only before "of": a bare "side salad" is still the dish. */
    var so = / side of /.exec(t);
    if (so) {
      claimed[t.slice(0, so.index + 1).split(' ').length - 2] = 1;
    }
    return claimed;
  }

  /* Score an item against the utterance by how much of the ITEM's name the
     resident actually said. Deliberately not edit-distance: the house rule is
     that a fuzzy match never becomes a fact, and word overlap is explainable
     to a resident ("I heard 'filet'"). Ambiguity is reported, never resolved
     by coin flip. */
  function matchItems(state, text) {
    var t = norm(text);
    var claimed = optionClaimedWords(state, t);
    var optWords = optionWords(state);
    var contentCount = words(text).filter(function (w) {
      return !STOP[w] && !FILLER[w] && w.length >= 3;
    }).length;
    var scored = [];
    for (var i = 0; i < state.items.length; i++) {
      var it = state.items[i];
      if (it.is86) continue;
      /* NOT SERVED TODAY IS ALSO NOT ORDERABLE. "just a bowl of soup" on a
         Thursday proposed the Cold Soup, which runs on Wednesdays: the menu
         page filters day-gated dishes and the chat did not, so the two
         surfaces disagreed about what exists. The flag is stamped by the
         engine rather than recomputed here -- the day rule gets one source,
         like every other identity rule in this project. Found by measuring
         the chat against a corpus, not by another bug report. */
      if (it.servedToday === false) continue;
      /* DEDUPE THE NAME WORDS. "Eggs Your Way — Two Eggs" carries "eggs"
         twice, so saying "eggs" scored it 0.44 against "One Egg"'s 0.29 --
         clear of the ambiguity band, so the chat silently proposed the $6.00
         row over the $4.00 one. Every other size pair (soup, ice cream, tea)
         asks, because their names do not happen to repeat a word. A word the
         resident said once is one piece of evidence however many times the
         menu writer typed it. */
      var seen = {};
      var nw = words(it.name).filter(function (w) {
        if (STOP[w] || w.length <= 2 || seen[w]) return false;
        seen[w] = 1;
        return true;
      });
      if (!nw.length) continue;
      /* A LITERAL NAME BEATS OPTION-CLAIMING. "a grilled cheese" was answered
         "that comes as a side" -- on a menu whose Housemade Salad Sandwich or
         GRILLED CHEESE is a real dish -- because both words are also option
         values, so both were claimed and the dish scored zero. Words spent
         naming a side are not evidence about a dish, which is right; but when
         the run of words the resident typed IS a run of words in a dish's
         name, they are not naming a side, they are naming the dish. */
      var forced = {};
      (function () {
        var uw = words(t), nn = norm(it.name);
        for (var a = 0; a < uw.length; a += 1) {
          for (var b = uw.length; b > a + 1; b -= 1) {
            var run = uw.slice(a, b);
            if (run.every(function (w) { return STOP[w] || FILLER[w]; })) continue;
            if (nn.indexOf(' ' + run.join(' ') + ' ') !== -1) {
              run.forEach(function (w) { forced[w] = 1; });
              return;
            }
          }
        }
      }());

      var hits = 0, longest = 0, matchedWords = [];
      for (var j = 0; j < nw.length; j++) {
        if (forced[nw[j]]) {
          hits += 1;
          matchedWords.push(nw[j]);
          if (nw[j].length > longest) longest = nw[j].length;
          continue;
        }
        /* Count an occurrence only where the resident was not already using
           that word to name an OPTION. Every occurrence has to be checked, not
           just the first: "french" in "french fries" is spoken for, but
           somebody who says "french toast with french fries" still gets their
           French Toast from the unclaimed one. */
        /* PLURALS BOTH WAYS. "two coffees" missed Ronnoco Coffee entirely and
           came back "not on today's menu" -- the coffee is very much on the
           menu. The menu writes some names singular and some plural, and
           residents do the same, so the two are compared on their stems. */
        var at = findWordish(t, nw[j]);
        var counted = false;
        while (at !== -1 && !counted) {
          var wi = t.slice(0, at + 1).split(' ').length - 2;
          if (!claimed[wi]) counted = true;
          else at = findWordish(t, nw[j], at + 1);
        }
        if (counted) {
          hits += 1;
          matchedWords.push(nw[j]);
          if (nw[j].length > longest) longest = nw[j].length;
        }
      }
      if (!hits) continue;
      /* NO "a dish needs a word of its own" RULE HERE, and the attempt is
         worth recording. Rejecting any dish whose matched words all appear
         somewhere in the option vocabulary turned "french toast" into a SIDE:
         "french" is in French fries and "toast" is in the toast choices, so
         a dish on the breakfast card stopped being a dish. Option WORDS are
         far too broad a signal. The precise one is optionClaimedWords above
         -- an actual option PHRASE occurring in this utterance -- which is
         already applied per-occurrence when counting hits. */
      // fraction of the dish's own name that was said, tie-broken by the
      // longest matched word so "soup" does not beat "chicken shawarma"
      scored.push({ item: it, score: hits / nw.length + longest / 100,
                    hits: hits, matched: matchedWords, nameWords: nw.length });
    }
    /* MORE OF THE DISH NAMED WINS, then the fraction. Sorting on the
       fraction alone put the one-word side "Vegetables" above "Vegetable
       Stir Fry" for somebody who had said all three words -- a one-word
       name is trivially 100% complete, which is a property of the name
       and not evidence about the order. */
    scored.sort(function (a, b) {
      if (b.hits !== a.hits) return b.hits - a.hits;
      return b.score - a.score;
    });
    return scored;
  }

  /* ---------------------------------------------------- option extraction */

  function choiceNames(group) {
    return group.choices.map(function (c) {
      return (c && c.name !== undefined) ? c.name : c;
    });
  }

  /* ------------------------------------------------------- negation ------
   *
   * "no X" MUST NOT SELECT X. Before this, "vegetable stir fry, no 6oz
   * grilled salmon" put a 6oz grilled salmon on the plate and $7.50 on the
   * bill -- the exact inverse of what the resident said, on the money. The
   * word matching had no idea a "no" in front of a choice changed anything.
   *
   * A hold runs from the negation word until something additive ends it.
   * Plain "and" CONTINUES it ("no onions and pickles" holds both), because
   * when the reading is ambiguous the safe direction is to leave the thing
   * off: a missing item gets asked about, an unwanted one gets eaten and
   * billed.
   */
  var NEG_START = { no: 1, without: 1, hold: 1, skip: 1, minus: 1, not: 1,
                    omit: 1, never: 1 };
  var NEG_END = { with: 1, plus: 1, add: 1, added: 1, extra: 1, but: 1,
                  also: 1, then: 1,
                  /* "double fries with the burger" was REFUSED -- "I do not
                     see double fries on today's menu" -- while "extra fries"
                     went through and reached the kitchen note. The two words
                     do the same grammatical job: an additive modifier that
                     ends a hold run. Only "extra" was in the list. */
                  double: 1, triple: 1 };

  /* Which WORDS of an utterance sit inside a hold. Indexed the same way
     words() indexes them, so a match's character position maps straight in.
     Punctuation ends a hold, which is why this reads the raw text rather
     than norm()'s output -- norm() throws commas away. */
  function negatedWords(text) {
    var toks = String(text || '').toLowerCase().match(/[a-z0-9]+|[,;.!?]/g) || [];
    var neg = [];
    var on = false, held = 0;
    for (var i = 0; i < toks.length; i++) {
      var tk = toks[i];
      if (/^[,;.!?]$/.test(tk)) { on = false; continue; }   // no word index used
      if (tk === 'leave' && (toks[i + 1] === 'off' || toks[i + 1] === 'out')) {
        on = true; neg.push(true); neg.push(true); i++; continue;
      }
      if (NEG_START[tk]) { on = true; held = 0; neg.push(true); continue; }
      if (on && NEG_END[tk]) { on = false; }
      neg.push(on);
      /* A HOLD ENDS ONCE IT HAS NAMED ITS THING, unless it is joined on with
         "and"/"or". "no cheese crispy" holds the cheese and leaves "crispy"
         as the positive request it is -- before this the run ran to the end
         of the sentence and swallowed it. "no onions and pickles" still holds
         both, because the join says so. */
      if (on && !STOP[tk] && !FILLER[tk]) {
        held += 1;
        var next = toks[i + 1];
        if (held >= 1 && next !== 'and' && next !== 'or') on = false;
      }
    }
    return neg;
  }

  /* A choice whose own name begins with a negation word IS the hold -- "No
     tzatziki", "No protein". Those must keep matching, or the fix above would
     delete the very feature it protects. */
  function isHoldChoice(name) {
    return /^\s*(no|without)\b/i.test(String(name || ''));
  }

  /* Pull option values the resident already said, so the chat only asks for
     what is genuinely missing. Longest choice first, so "baked potato" is not
     shadowed by "baked". */
  function extractSelections(item, text) {
    var t = norm(text);
    var neg = negatedWords(text);
    /* Word index of a character position in t. t is ' w0 w1 ... ', so the
       words before a position are its spaces minus the leading one. */
    function wordIndexAt(at) { return t.slice(0, at + 1).split(' ').length - 2; }
    var out = {};
    var groups = item.options || [];
    /* Character spans already claimed by an earlier group. Two "choice"
       groups can share a list (First side / Second side), and without this
       both matched the SAME words: "baked potato and broccoli" came back as
       baked potato TWICE. Mentions are consumed in the order the resident
       said them. */
    var used = [];
    function free(a, b) {
      for (var k = 0; k < used.length; k++) {
        if (a < used[k][1] && b > used[k][0]) return false;
      }
      return true;
    }
    /* THE DISH'S OWN NAME IS NOT A CHOICE THE RESIDENT MADE. "Housemade Salad
       Sandwich or Grilled Cheese" literally contains one of its own options,
       so asking for it "with Egg salad" filled the group from the NAME --
       Grilled cheese -- and dropped the egg salad. Reserve the span the name
       occupies before anything competes for it.

       A bare "grilled cheese" therefore leaves the group unanswered and the
       chat asks which one. Mildly redundant, never wrong, and the safe
       direction: the alternative silently picks a filling nobody named. */
    (function reserveTheName() {
      var n = norm(item.name).trim();
      var at = n ? t.indexOf(' ' + n + ' ') : -1;
      if (at !== -1) { used.push([at + 1, at + 1 + n.length]); }
    }());
    /* LONGEST PHRASE FIRST ACROSS EVERY GROUP, not group by group.
       Group-at-a-time let a SHORT value in an earlier group eat a word
       belonging to a LONGER value in a later one: "salmon with a baked
       potato" gave the fish a Cooked of "Baked" -- a preparation the resident
       never asked for -- and then lost the baked potato entirely, because the
       word was already spent. Wrong plate and a missing side from one
       collision, and there were seven such pairs on the menu.

       So candidates from all groups compete on length, and each group is
       filled up to its own capacity as the winners land. */
    var cands = [];
    groups.forEach(function (grp, gi) {
      choiceNames(grp).forEach(function (name) {
        var n = norm(name).trim();
        if (n) cands.push({ gi: gi, grp: grp, name: name, n: n });
      });
    });
    cands.sort(function (a, b) {
      if (b.n.length !== a.n.length) return b.n.length - a.n.length;
      return a.gi - b.gi;              // stable: earlier group wins a tie
    });

    var picks = {};                    // group index -> [{at, name}]
    cands.forEach(function (c) {
      var cap = c.grp.type === 'choice' ? 1 : (c.grp.max || 99);
      var got = picks[c.gi] || (picks[c.gi] = []);
      if (got.length >= cap) return;
      if (got.some(function (f) { return f.name === c.name; })) return;
      var hold = isHoldChoice(c.name);
      var at = t.indexOf(' ' + c.n + ' ');
      while (at !== -1) {
        /* Inside a hold and not itself a hold -> the resident asked for this
           to be LEFT OFF. Do not select it. */
        if (!hold && neg[wordIndexAt(at)]) { at = t.indexOf(' ' + c.n + ' ', at + 1); continue; }
        if (free(at + 1, at + 1 + c.n.length)) {
          used.push([at + 1, at + 1 + c.n.length]);
          got.push({ at: at, name: c.name });
          return;
        }
        at = t.indexOf(' ' + c.n + ' ', at + 1);
      }
    });

    groups.forEach(function (grp, gi) {
      var got = picks[gi] || [];
      if (!got.length) return;
      // in the order the resident said them, so First side is the first named
      got.sort(function (a, b) { return a.at - b.at; });
      out[grp.label] = got.map(function (f) { return f.name; });
    });
    return out;
  }

  /* A HOLD WE COULD NOT MATCH MUST NOT VANISH. "flat iron rare french fries
     and broccoli no sauce" came back "Flat Iron Steak — Rare · French fries ·
     Broccoli" and the "no sauce" was gone: silently, with no note to the
     kitchen and nothing on screen to tell the resident it had been dropped.
     The steak's printed description mentions no sauce, so there is correctly
     no "No sauce" choice to match -- which makes swallowing it worse, not
     better, because the resident is telling us something the menu does not
     know.

     It goes in the free-text item note, which is part of the line and prints
     on the kitchen ticket. Colin, 2026-08-20, on exactly this: "for now just
     let them type it out i guess." */
  function unmatchedHolds(item, text, selections) {
    var neg = negatedWords(text);
    var all = words(text);
    var chosen = ' ';
    Object.keys(selections || {}).forEach(function (k) {
      selections[k].forEach(function (v) { chosen += norm(v).trim() + ' '; });
    });

    var runs = [], cur = [];
    for (var i = 0; i < all.length; i++) {
      var w = all[i];
      if (neg[i] && !NEG_START[w] && w !== 'off' && w !== 'out') {
        if (!STOP[w] && !FILLER[w]) cur.push(w);
      } else if (cur.length) { runs.push(cur); cur = []; }
    }
    if (cur.length) runs.push(cur);

    return runs.filter(function (run) {
      /* Already honoured as a real option? Then it is not unmatched. */
      return !run.some(function (w) { return chosen.indexOf(' ' + w + ' ') !== -1; });
    }).map(function (run) { return 'no ' + run.join(' '); });
  }

  /* ANYTHING ELSE THEY ASKED FOR. "Eggplant parm extra sauce no cheese
     crispy" captured the hold and dropped "extra sauce" and "crispy" without
     a word -- the same silent loss as the swallowed "no sauce", just on the
     positive side. The menu has no option for either, and it should not: a
     kitchen can honour "crispy" without the card listing it.

     So whatever is left after the dish name, the options and the holds have
     taken their words goes into the line's free-text note, which prints on
     the ticket and is read back in the confirmation. Colin, 2026-08-20, on
     exactly this: "for now just let them type it out i guess." */
  function leftoverRequests(item, text, selections) {
    var neg = negatedWords(text);
    var all = words(text);
    var chosen = ' ';
    Object.keys(selections || {}).forEach(function (k) {
      selections[k].forEach(function (v) { chosen += norm(v).trim() + ' '; });
    });
    var nameWords = words(item.name);

    function spokenFor(w) {
      if (STOP[w] || FILLER[w] || NUMBER_WORD[w] || w.length < 3) return true;
      if (chosen.indexOf(' ' + w + ' ') !== -1) return true;
      /* PLURALS, the third place this file needed them. "two coffees" ordered
         the coffee and then told the kitchen it could not place "coffees". */
      var st = stems(w);
      for (var s = 0; s < st.length; s++) {
        if (chosen.indexOf(' ' + st[s] + ' ') !== -1) return true;
        if (nameWords.indexOf(st[s]) !== -1) return true;
      }
      for (var i = 0; i < nameWords.length; i++) {
        var nw = nameWords[i];
        if (nw === w) return true;
        // the abbreviation the resident used for this dish is not leftover
        if (w.length >= 4 && nw.length > w.length && nw.indexOf(w) === 0) return true;
      }
      return false;
    }

    var runs = [], cur = [];
    for (var i = 0; i < all.length; i++) {
      if (!neg[i] && !spokenFor(all[i])) cur.push(all[i]);
      else if (cur.length) { runs.push(cur.join(' ')); cur = []; }
    }
    if (cur.length) runs.push(cur.join(' '));
    return runs;
  }

  /* Required groups still unanswered, in menu order -- the chat asks for them
     one at a time rather than interrogating. */
  function missingGroups(item, selections) {
    var out = [];
    var groups = item.options || [];
    for (var g = 0; g < groups.length; g++) {
      if (groups[g].type !== 'choice') continue;
      var v = (selections || {})[groups[g].label];
      if (!v || !v.length) out.push(groups[g]);
    }
    return out;
  }

  /* NAMED IN THE DESCRIPTION, NOT THE TITLE. "soup and half a sandwich" is a
     Pick Combo -- its description reads "a cup of soup ... a half deli
     sandwich" -- but the parser only ever read NAMES, so it offered three
     unrelated sandwiches. A description match is much weaker evidence than a
     name match, so it may ONLY join a question and can never become a
     proposal on its own; and it needs two content words, or one common word
     would drag in a dozen dishes. */
  function describedBy(state, text) {
    var content = words(text).filter(function (w) {
      return !STOP[w] && !FILLER[w] && w.length >= 3;
    });
    if (content.length < 2) return [];
    var out = [];
    state.items.forEach(function (it) {
      if (it.is86 || it.servedToday === false) return;
      var d = norm(it.description || '');
      var n = content.filter(function (w) { return d.indexOf(' ' + w) !== -1; }).length;
      if (n >= 2) out.push({ item: it, hits: n });
    });
    out.sort(function (a, b) { return b.hits - a.hits; });
    return out.map(function (o) { return o.item; });
  }

  /* AN UNPLACEABLE WORD JOINED BY "and" IS A SECOND THING THEY ASKED FOR.
     "toast and jam" is not evidence for French Toast; "reuben but hold the
     kraut" is, because "kraut" arrives after a HOLD and is a subtraction
     rather than an addition. Same word position, opposite meanings, so the
     word before it is what decides. */
  /* IS THE WORD WE CANNOT PLACE A SHORTENING, OR A DIFFERENT DISH?
     "ill do the filet, med rare" and "reuben but hold the kraut" both name
     one dish perfectly and then add a word the parser does not know -- and
     both should go through, because "med" is inside "medium" and "kraut" is
     inside "sauerkraut". "chicken parmesan" also names one dish and adds an
     unknown word, and must NOT go through: "parmesan" is not a shortening of
     anything on the menu, it is a different dish, and proposing the shawarma
     is the confidently-wrong-plate failure this whole file is written
     against. Substring of some menu word is what separates them, and it is
     measured against the menu rather than a list of abbreviations we thought
     of -- so a menu change moves the answer with it. */
  /* Uses the menuVocabulary() that already exists further down rather than
     building a second one. My first version of this DID define a second
     function of the same name -- and because JS function declarations hoist,
     the existing one silently won, my copy was dead code, and the two
     disagreed about their cache shape. It threw on the twentieth utterance,
     not the first. */
  /* The words of ONE item -- its name, its description, its option labels and
     every option value on it. */
  function itemVocabulary(it) {
    if (it._words) return it._words;
    var v = {};
    function add(s) { words(s).forEach(function (w) { if (w.length >= 3) v[w] = 1; }); }
    add(it.name); add(it.description || '');
    (it.options || []).forEach(function (g) {
      add(g.label);
      g.choices.forEach(function (c) {
        add(String((c && c.name !== undefined) ? c.name : c));
      });
    });
    it._words = Object.keys(v);
    return it._words;
  }

  /* Content words the parser could not place anywhere. The grammar of a hold
     is not a stray word: "reuben hold the kraut" failed on "hold", not on
     "kraut" -- the rule was right and the word list it ran over was wrong,
     which looks identical from the outside. */
  function strayWords(state, text) {
    var ow = optionWords(state), owners = dishOwners(state);
    var allW = words(text);
    return allW.filter(function (w, wi) {
      if (vesselHolding(w, wi, allW)) return false;
      if (w.length < 3 || (FILLER[w] && !VESSEL[w]) || STOP[w] || ow[w] ||
          owners[w] || HOLDWORD[w] || JOINER[w] || NUMBER_WORD[w] ||
          CLAUSE_BREAK[w]) return false;
      /* PLURALS COUNT AS PLACED. "two SIDES of green beans with the snapper"
         failed on "sides" -- the menu writes the option "Side", the resident
         said "sides", and that one unplaceable word was enough to stop the
         snapper being named outright, which dropped the order into a
         question offering two steaks and a salad. Every other part of this
         file compares words on their stems; this one did exact lookups. */
      /* BOTH STEMS, and the first version got this wrong in a way that
         looked right: /(es|s)$/ turns "sides" into "sid", because the
         alternation tries "es" first and "sides" does end in "es". The
         snapper order stayed broken and the fix looked applied. */
      return !stems(w).some(function (st) { return ow[st] || owners[st]; });
    });
  }

  /* Nothing here is foreign to the menu. A word that appears ANYWHERE --
     including inside a description, like "half" in the Pick Combo -- counts
     as menu language; only a word the menu has never heard of does not. */
  function noForeignWords(state, text) {
    var vocab = menuVocabulary(state);
    return strayWords(state, text).every(function (w) { return !!vocab[w]; });
  }

  /* SCOPED TO THE DISH, and it has to be. Checking the stray against the whole
     menu turned the shortening rule into a wildcard: "mac and cheese" is not
     on this menu, and it went through as a grilled cheese because "macaroni"
     exists somewhere else entirely, as a side. A shortening is only evidence
     when it shortens something on THE DISH BEING PROPOSED -- "med" is a
     temperature on the filet, "kraut" is in the reuben. */
  function straysShortenTheDish(state, text, item) {
    var vocab = itemVocabulary(item);
    var all = words(text), ow = optionWords(state);
    /* WHERE THE SHORTENING SITS DECIDES WHETHER IT IS ONE. Substring alone is
       too generous: "pot" is inside "potato", which is a side on Roasted
       Chicken, so "POT ROAST" -- a dish this kitchen does not make -- went
       through as roast chicken with the "pot" silently dropped. A real
       shortening turns up where an option is being chosen ("filet, MED
       rare") or inside a hold ("hold the KRAUT"); it does not sit bare in
       front of the dish name doing the work of a noun. */
    function inOptionContext(w) {
      var i = all.indexOf(w);
      if (i === -1) return true;
      for (var d = 1; d <= 2; d += 1) {
        if (i - d >= 0 && (ow[all[i - d]] || HOLDWORD[all[i - d]])) return true;
        if (i + d < all.length && ow[all[i + d]]) return true;
      }
      return false;
    }
    return strayWords(state, text).every(function (w) {
      /* A VARIANT SPELLING is exempt from the position rule above, because it
         is NAMING the dish rather than choosing something on it -- "eggplant
         parmigiana" has no option anywhere near it and is still the eggplant
         parmesan. */
      var variant = vocab.some(function (v) {
        return w.length >= 7 && v.length >= 7 && v.slice(0, 4) === w.slice(0, 4);
      });
      if (variant) return true;
      if (!inOptionContext(w)) return false;
      return vocab.some(function (v) {
        if (v !== w && v.length > w.length && v.indexOf(w) !== -1) return true;
        /* A VARIANT SPELLING of one of this dish's own words. "eggplant
           parmigiana" was refused outright on a menu that sells Eggplant
           Parmesan: the two words differ by five characters, so no edit
           distance will ever connect them, and "parmigiana" is not a
           shortening of anything. Both sides long, first four characters
           shared -- which is why "pot" and "potato" do not qualify. */
        return w.length >= 7 && v.length >= 7 && v.slice(0, 4) === w.slice(0, 4);
      });
    });
  }

  var JOINER = { and: 1, with: 1, plus: 1, also: 1 };
  /* WORDS THAT INTRODUCE A ROLE RATHER THAN A DISH. This is the thread that
     runs through nearly every defect in this file: a word is not evidence
     about the dish just because it is present -- what matters is the job it
     is doing in the sentence. After "for" comes a PERSON or an occasion,
     after "at" comes a TIME, and neither is a claim that we serve something.
     Measured on a corpus built from roles the parser had never been taught:
     "the filet for my wife" and "the filet at 6pm" were both REFUSED --
     "I do not see wife on today's menu" -- throwing away a $22 steak order
     over a word that was never naming a dish. */
  var ROLE_MARKER = { for: 1, at: 1, around: 1, before: 1, after: 1 };
  /* A QUESTION IS NOT AN ORDER, and this one shipped. Same thread as "for"
     and "at" above -- presence is not evidence, ROLE is -- but these words
     never name food at all, in any sentence. "Ok why didnt yoh ask my sides"
     was read as a claim that this kitchen serves something called "why
     didnt", and the chat answered, in the resident's own words back at them,
     "I do not see why didnt on today's menu." Colin showed that to his boss.
     "what about my sides" echoed "what". The echo is a good feature -- naming
     the dish beats "I could not find that" -- so the fix is not to stop
     echoing, it is to never echo a word that cannot be a dish. */
  var NOT_A_DISH = {};
  ('why what how when where who which whose whom whats hows ' +
   'did didnt didn does doesnt do dont don is isnt are arent was wasnt were ' +
   'can cant cannot could couldnt should shouldnt would wouldnt will wont ' +
   'am ive im id ill youre youve ' +
   'you your yours my mine me i we our us they them their ' +
   'ask asked asking tell told say said saying ' +
   'please thanks thank ok okay hi hello hey yeah yep nope ' +
   'again still yet just about only really actually maybe').split(' ')
    .forEach(function (w) { if (w) NOT_A_DISH[w] = true; });
  /* A SERVICE, NOT A DISH. "can i still order breakfast" is asking whether
     breakfast is still being served; it came back as an ORDER for Breakfast
     Breads & Sweets, because that heading happens to start with the word.
     Same thread as "for" and "at": the word is doing a different job. */
  var MEAL_PERIOD = { breakfast: 1, lunch: 1, dinner: 1, brunch: 1,
                      supper: 1, snack: 1 };
  /* A NEW CLAUSE IS A NEW THOUGHT. "the salmon if its fresh otherwise the
     chicken" offered three chicken dishes and dropped the salmon: the
     head-noun rule read "chicken" as the noun of the same phrase, across two
     clause boundaries. */
  var CLAUSE_BREAK = { if: 1, otherwise: 1, or: 1, then: 1, unless: 1,
                       instead: 1, actually: 1, wait: 1, but: 1 };
  var HOLDWORD = { no: 1, without: 1, hold: 1, skip: 1, leave: 1, light: 1,
                   easy: 1, off: 1, minus: 1 };
  function conjoinedUnknown(state, text) {
    var ws = words(text), ow = optionWords(state), owners = dishOwners(state);
    for (var i = 1; i < ws.length; i += 1) {
      var w = ws[i];
      if (w.length < 3 || STOP[w] || FILLER[w] || ow[w] || owners[w]) continue;
      var held = false, joined = false;
      for (var j = i - 1; j >= 0 && j >= i - 4; j -= 1) {
        if (HOLDWORD[ws[j]]) { held = true; break; }
        /* JOINER only. A ROLE_MARKER word ("for my wife", "at 6pm") is
           handled earlier, in unmatchedDish: it never becomes a claim at
           all, so the order goes through and the words reach the kitchen
           note. Treating it as a second dish here asked a needless
           question instead. */
        if (JOINER[ws[j]]) { joined = true; break; }
        /* Skip back over articles AND vessel words. "the filet and a glass of
           chardonnay" stopped at "glass" and so never saw the "and" -- the
           order was refused outright over a wine we do not serve, instead of
           confirming the filet and saying so about the wine. */
        if (!STOP[ws[j]] && !FILLER[ws[j]]) break;
      }
      if (joined && !held) return w;
    }
    return null;
  }

  /* EVERY ADJACENT PAIR OF WORDS THE MENU ACTUALLY USES. Word-level checks
     cannot see a compound: "hash browns" reached CORNED BEEF HASH because
     "hash" is a real menu word and "browns" stems to "brown", which is also
     a real menu word -- Brown rice. Two words the menu knows, in an order it
     has never used, and the parser served a plate of corned beef hash to
     somebody asking for hash browns.

     Pairs are collected per TEXT, so nothing joins across the end of one
     dish name and the start of the next. */
  function menuBigrams(state) {
    if (state._bigrams) return state._bigrams;
    var b = {};
    function add(str) {
      var w = words(str);
      for (var i = 0; i + 1 < w.length; i += 1) b[w[i] + ' ' + w[i + 1]] = 1;
    }
    state.items.forEach(function (it) {
      add(it.name); add(it.description || '');
      (it.options || []).forEach(function (g) {
        add(g.label);
        g.choices.forEach(function (c) {
          add(String((c && c.name !== undefined) ? c.name : c));
        });
      });
    });
    state._bigrams = b;
    return b;
  }

  /* NEGATING A WHOLE DISH, which is not the same as holding an ingredient.
     The hold machinery understands "no cheese" because cheese is an option on
     the plate. Nothing understood "anything but soup" -- and the only reason
     it did not offer a soup was that "anything" happened to be a word the
     menu does not have. That is luck, and luck is not a rule: drop the word
     and "but soup" would have sold a soup to somebody who just said they did
     not want one.

     Deliberately narrow. It fires on an explicit EXCLUSION frame only, never
     on a bare "no X", because "no onions" is a hold the pickers already take
     and reading it as "not this dish" would refuse an ordinary order. */
  var EXCLUDE_RE = /\b(anything but|any thing but|other than|apart from|besides|except|not the|nothing with|no more)\b/i;

  function excludedWords(text) {
    var out = {};
    var m = EXCLUDE_RE.exec(text);
    if (!m) return out;
    /* The words of the frame itself are spoken for, exactly like a word
       spent naming a side. This menu has an item called OTHER DRINKS, so
       "anything other than the reuben" matched a dish on the word "other" --
       and that match then survived the exclusion, because the thing being
       excluded was the reuben. */
    words(m[0]).forEach(function (w) { if (w.length >= 3) out[w] = 1; });
    var after = String(text).slice(m.index + m[0].length);
    /* Only up to the next clause boundary: in "anything but soup, maybe the
       lamb", the lamb is what they DO want. */
    after = after.split(/[,.;]| then | instead /i)[0];
    words(after).forEach(function (w) {
      if (!STOP[w] && !FILLER[w] && w.length >= 3) out[w] = 1;
    });
    return out;
  }

  /* "POT OF TEA" IS A VESSEL. "POT ROAST" IS A DISH WE DO NOT MAKE.
     The vessel words were added so "a pot of tea" and "a glass of milk"
     would stop being read as unknown dishes, and the blunt version of
     that made "pot" invisible everywhere -- so "pot roast" quietly became
     ROASTED CHICKEN, matching on "roast" with the "pot" thrown away. A
     vessel is only a vessel when it is holding something. */
  var VESSEL = { pot: 1, glass: 1, plate: 1, serving: 1, portion: 1,
                 piece: 1, bowl: 1, cup: 1 };
  function vesselHolding(w, i, all) {
    return !!VESSEL[w] && all[i + 1] === 'of';
  }

  /* Would fixing an obvious misspelling make this a pair the menu uses? That
     is what separates a typo from a dish we do not serve. */
  function correctedPairExists(state, first, second, big) {
    var v = menuVocabulary(state);
    for (var word in v) {
      if (!Object.prototype.hasOwnProperty.call(v, word)) continue;
      if (Math.abs(word.length - second.length) > 2) continue;
      var allow = word.length >= 7 ? 2 : 1;
      if (editDistance(second, word) <= allow && big[first + ' ' + word]) return true;
    }
    return false;
  }

  /* A COMPOUND THE KITCHEN DOES NOT MAKE. If the resident's word ran straight
     into another content word, those two words are naming ONE thing -- and if
     the menu has never put them together, matching only the first is matching
     a modifier and calling it the dish. Deliberately narrow: the second word
     is excused if the dish can be served with it ("filet ... medium"), if the
     dish's own name contains it, or if it is grammar. */
  function unservedCompound(state, text, top) {
    var w = words(text);
    var matched = top.matched || [];
    var big = menuBigrams(state);
    var vocab = itemVocabulary(top.item);
    var owners = dishOwners(state);
    for (var i = 0; i + 1 < w.length; i += 1) {
      if (matched.indexOf(w[i]) === -1) continue;
      var nxt = w[i + 1];
      if (!nxt || nxt.length < 3) continue;
      if (STOP[nxt] || FILLER[nxt] || NUMBER_WORD[nxt] || HOLDWORD[nxt] ||
          JOINER[nxt] || CLAUSE_BREAK[nxt] || NEG_START[nxt] || NEG_END[nxt]) continue;
      if (matched.indexOf(nxt) !== -1) continue;
      if (big[w[i] + ' ' + nxt]) continue;
      /* FOUR WAYS TO BE INNOCENT, and the first version of this rule had only
         one, so it broke six things at once. A word is not a foreign compound
         when:
           it is a menu word in its own right   -- "tenderloin RARE"
           it shortens something on this dish   -- "eggplant PARM", "filet MED"
           it is a plural of this dish's own vocabulary
           it is a TYPO whose correction makes a real pair -- "pressed RUEBEN"
              corrects to "pressed reuben", which the menu does use.
         What survives all four is the real thing: "hash BROWNS", where both
         words are plausible, neither is misspelled, and the menu has simply
         never put them together. */
      if (menuVocabulary(state)[nxt]) continue;
      if (vocab.indexOf(nxt) !== -1) continue;
      if (stems(nxt).some(function (st) { return vocab.indexOf(st) !== -1; })) continue;
      if (vocab.some(function (v) {
        return v.length > nxt.length && v.indexOf(nxt) === 0 && nxt.length >= 3;
      })) continue;
      /* A LONG WORD SHARING A LONG PREFIX is a variant spelling, not a
         different dish: "eggplant parmigiana" is the eggplant parmesan,
         and edit distance will never say so -- the two differ by five
         characters. Both sides must be long, which is what keeps short
         coincidences like "pot"/"potato" out of it. */
      if (nxt.length >= 7 && vocab.some(function (v) {
        return v.length >= 7 && v.slice(0, 4) === nxt.slice(0, 4);
      })) continue;
      if (correctedPairExists(state, w[i], nxt, big)) continue;
      return w[i] + ' ' + nxt;
    }

    /* AND THE OTHER SIDE OF THE MATCHED WORD. "iced coffee" ordered a
       Ronnoco Coffee: "coffee" matched, and "iced" sat in front of it
       unexamined -- even though "iced" is a word this menu uses, for a
       different drink. Restricted to words that name some OTHER dish, and
       excused when the word is part of this dish's own name, so "steak
       burger" and "hot dog" are untouched. */
    for (var k = 1; k < w.length; k += 1) {
      if (matched.indexOf(w[k]) === -1) continue;
      var prev = w[k - 1];
      if (!prev || !owners[prev]) continue;
      if (matched.indexOf(prev) !== -1) continue;
      if (words(top.item.name).indexOf(prev) !== -1) continue;
      if (vocab.indexOf(prev) !== -1) continue;
      if (big[prev + ' ' + w[k]]) continue;
      return prev + ' ' + w[k];
    }
    return null;
  }

  /* --------------------------------------------------------- the proposal */

  /* One utterance in, one PROPOSAL out. Never touches the cart. */
  function propose(state, text) {
    var intent = detectIntent(text, state);
    if (intent !== 'order') return { intent: intent };

    var matches = matchItems(state, text);
    var notOnMenu = unmatchedDish(state, text);

    /* A dish the resident explicitly ruled out is not a candidate for the
       thing they want. If ruling it out empties the running, they have told
       us what they do NOT want and nothing else -- so answer with what is on
       today rather than with silence. */
    var excluded = excludedWords(text);
    if (Object.keys(excluded).length) {
      var kept = matches.filter(function (m) {
        return !(m.matched || []).some(function (w) { return excluded[w]; });
      });
      if (kept.length !== matches.length) {
        if (!kept.length) return { intent: 'recommend' };
        matches = kept;
      }
    }

    /* THEY NAMED A SIDE, NOT A DISH. "french fries" came back as "I could not
       find that on today's menu" -- which is FALSE. The fries are on the
       menu; they are a side, and a side needs something to sit beside. The
       first fix stopped a side dragging a dish into the running and then
       overshot into denying the side exists at all.

       Fires only when no dish matched AND every content word is option
       vocabulary, so "fries", "mashed potatoes", "green beans" and "a side of
       fries" are answered honestly while anything carrying a real unknown
       word still gets the not-on-the-menu reply. */
    if (!matches.length && !notOnMenu) {
      var ow = optionWords(state);
      var content = words(text).filter(function (w) {
        return !STOP[w] && !FILLER[w] && w.length >= 3;
      });
      if (content.length && content.every(function (w) { return ow[w]; })) {
        var phrase = sidePhrase(state, text) || content.join(' ');
        /* WHICH DISH IS IT A CHOICE ON? "BLT" is not a side -- it is one of
           the cold cuts -- and telling somebody it "comes as a side" is the
           wrong sentence about a real thing. Name the dish where we can. */
        var onDishes = [];
        state.items.forEach(function (it) {
          if (it.is86) return;
          (it.options || []).forEach(function (g) {
            g.choices.forEach(function (c) {
              var n = norm((c && c.name !== undefined) ? c.name : c).trim();
              /* The phrase as a WORD RUN inside the choice: "blt" is inside
                 "Classic BLT". Equality alone found nothing, which is how
                 this shipped empty the first time. */
              var np = norm(phrase).trim();
              if (n && np && (' ' + n + ' ').indexOf(' ' + np + ' ') !== -1 &&
                  onDishes.indexOf(it.name) === -1) {
                onDishes.push(it.name);
              }
            });
          });
        });
        return { intent: 'side', side: phrase,
                 /* Only useful when it is a handful of dishes. "Broccoli" is
                    on two dozen and listing them would be noise. */
                 sideOf: onDishes.length && onDishes.length <= 3 ? onDishes : [] };
      }
    }

    if (!matches.length) {
      /* Before giving up: did they nearly type something we have? */
      var nm = nearMisses(state, text);
      if (nm.items.length) {
        return { intent: 'didyoumean', typed: nm.typed, options: nm.items };
      }
      return { intent: 'unknown', notOnMenu: notOnMenu };
    }

    /* THIS CHECK COMES FIRST, before the tie. "hot dog" half-matches Hot
       Cereal and Hot Tea equally, so the tie branch fired and offered a
       resident asking for a hot dog a choice between cereal and tea. A word
       we cannot place beats a tie between two dishes that only share a
       modifier. */
    /* DID THEY NAME A DISH, OR A FAMILY? A word only one dish owns is as good
       as naming it; a word several share names a family and deserves a
       question. Every failure left in the corpus was this distinction
       missing:
         "the steak, rare, with fries" -> steak is two dishes  -> ask
         "soup and half a sandwich"    -> sandwich is three    -> ask
         "ill do the filet, med rare"  -> filet is ONE         -> trust it
         "reuben but hold the kraut"   -> reuben is ONE        -> trust it
       The first two were confidently wrong; the last two were refused over an
       abbreviation the parser did not know. One rule, four fixes. */
    /* TWO DISHES NAMED: THE FIRST ONE IS THE ORDER. "stroganoff and a side
       salad" came back as a SIDE SALAD, because "Side Salad" is a complete
       two-word match and "stroganoff" is one word of "Beef Stroganoff", so
       it scored higher. Nobody orders the side and mentions the entree in
       passing. People lead with the plate they want and add to it, so when
       a joiner separates two solidly-named dishes, the earlier one is the
       order and the later one goes to alsoAsked -- which already exists and
       already says out loud what is being set aside. */
    var leadPromoted = false;
    if (matches.length > 1 && /\b(and|plus|with|also)\b/i.test(text)) {
      var saidW = words(text);
      function firstSaidAt(m) {
        var at = saidW.length;
        (m.matched || []).forEach(function (w) {
          var i = saidW.indexOf(w);
          if (i !== -1 && i < at) at = i;
        });
        return at;
      }
      var solid = matches.filter(function (m) { return m.score >= 0.5; });
      var lead = matches[0], leadAt = firstSaidAt(matches[0]), later = false;
      solid.forEach(function (m) {
        var at = firstSaidAt(m);
        if (at < leadAt) { lead = m; leadAt = at; }
      });
      /* A SECOND DISH, not a second reading of the first. Two solidly-named
         dishes at different places in the sentence with a joiner between
         them is somebody ordering two things. The flag has to be set even
         when the earlier dish is ALREADY first: "a reuben and a coffee"
         scores both at 0.560, so nothing needed promoting, and the tie
         branch below still asked "did you mean the reuben or the coffee?"
         about a sentence that named both. */
      solid.forEach(function (m) {
        var at = firstSaidAt(m);
        if (at <= leadAt) return;
        for (var k = leadAt; k < at; k += 1) {
          if (saidW[k] === 'and' || saidW[k] === 'plus' || saidW[k] === 'also') {
            later = true;
          }
        }
      });
      if (lead !== matches[0]) {
        matches = [lead].concat(matches.filter(function (m) { return m !== lead; }));
        leadPromoted = true;
      }
      if (later) leadPromoted = true;
    }
    var owners = dishOwners(state);
    var top = matches[0];

    /* Before anything trusts the top match: did they name a compound we do
       not make? "eggs and hash browns" proposed CORNED BEEF HASH. Offering
       whatever else was named beats a flat refusal, so the alternatives are
       carried into the question. */
    /* The ONLY word that matched is the name of a meal period -- so they
       named a service, not a plate. Answered with what is on, which is what
       the question was. Naming more than the period ("breakfast breads")
       stays an order. */
    if ((top.matched || []).length === 1 && MEAL_PERIOD[top.matched[0]]) {
      return { intent: 'menu' };
    }

    var compound = unservedCompound(state, text, top);
    if (compound) {
      var others = matches.filter(function (m) {
        return m !== top && !unservedCompound(state, text, m);
      }).slice(0, 3).map(function (m) { return m.item; });
      if (others.length) {
        return { intent: 'didyoumean', typed: compound, options: others };
      }
      return { intent: 'unknown', notOnMenu: compound };
    }

    var namedItOutright = (top.matched || []).some(function (w) {
      return owners[w] === 1;
    }) && straysShortenTheDish(state, text, top.item);

    /* THE LAST DISH WORD IS WHAT THEY ORDERED. English compounds are
       head-final: a french onion SOUP is a soup, a chicken fried STEAK is a
       steak. The parser scored on how much of a name it could match and had
       no idea which word was the noun, so "french onion soup" came back as
       FRENCH TOAST -- "french" belongs to exactly one dish, so the
       unique-word rule above trusted it -- and "chicken fried steak" came
       back as Oven Fried Chicken on two words out of three.

       Both are confidently wrong plates, and both are caught by one
       question: does the dish we picked contain the last dish-word they
       said? If it does not, and some other dish does, we matched the
       modifier and missed the noun. */
    /* WITHIN ONE NOUN PHRASE ONLY. "french onion soup" is one thing and its
       last word is the noun; "a reuben and a coffee" is TWO things, and
       reading the last word as the head there made the parser offer the
       coffee and forget the reuben. Same for "two eggs scrambled with wheat
       toast", where the head rule reached across "with" into the bread
       choice and offered FRENCH TOAST to somebody ordering eggs. A joiner
       between the dish and the candidate head means they are not the same
       phrase, so the rule does not apply. */
    var saidWords = words(text), headWord = null, headAt = -1;
    /* A WORD INSIDE A HOLD IS NOT THE NOUN THEY ORDERED. "burger no cheese no
       pickles" ends on words the resident is REMOVING, and reading "cheese"
       as the head offered them the grilled cheese sandwich. */
    var negHead = {};
    negatedWords(text).forEach(function (w) { negHead[w] = 1; });
    for (var hw = saidWords.length - 1; hw >= 0; hw -= 1) {
      if (negHead[saidWords[hw]]) continue;
      /* A QUANTITY IS NOT A NOUN. "two coffees" was answered with a choice
         between Ronnoco Coffee and EGGS YOUR WAY -- TWO EGGS, because "two"
         is a word in that dish's name and the head scan found it. */
      if (NUMBER_WORD[saidWords[hw]] || /^\d+$/.test(saidWords[hw])) continue;
      if (owners[saidWords[hw]]) { headWord = saidWords[hw]; headAt = hw; break; }
    }
    var firstMatchAt = saidWords.length;
    (top.matched || []).forEach(function (w) {
      var at = saidWords.indexOf(w);
      if (at !== -1 && at < firstMatchAt) firstMatchAt = at;
    });
    for (var jx = firstMatchAt; jx < headAt; jx += 1) {
      if (JOINER[saidWords[jx]] || CLAUSE_BREAK[saidWords[jx]]) {
        headWord = null;
        break;
      }
    }
    /* AND ONLY WHEN THE TOP MATCH IS PARTIAL. If the resident said a dish's
       WHOLE name, no other word in the sentence gets to overrule it: "the
       salmon if its fresh otherwise the chicken" names Salmon completely,
       and the head rule offered three chicken dishes instead. */
    if (top.hits >= top.nameWords) headWord = null;
    /* AN OPTION ON THE DISH IS NOT A DIFFERENT DISH. "salmon baked with green
       beans and corn" ends its noun-phrase on "baked", which is a COOKING
       METHOD on the salmon and also the first word of Baked Snapper -- so
       the head rule offered the snapper to somebody who had ordered the
       salmon and said how they wanted it cooked. Same shape as the baked
       potato on the filet. If the dish can be served that way, the word is
       part of this order. */
    if (headWord && itemVocabulary(top.item).indexOf(headWord) !== -1) headWord = null;

    if (headWord && (top.matched || []).indexOf(headWord) === -1) {
      var onNoun = matches.filter(function (m) {
        return (m.matched || []).indexOf(headWord) !== -1;
      }).map(function (m) { return m.item; });
      /* WHEN NOTHING IN THE RUNNING OWNS THE NOUN, look it up -- but only if
         the noun is not something the proposed dish can actually be served
         with. The first version of this skipped that condition and was
         reverted within the hour: "ill do the filet, med rare, baked potato"
         ends on "potato", the filet does not own that word, and the chat
         offered POTATO DISHES to somebody who had named their steak and its
         side perfectly. The baked potato is a SIDE ON THE FILET, which is
         exactly why it is not evidence of a different dish.
         "Half corned beef sandwich" is the other side of the same coin:
         "sandwich" is not anything Corned Beef Hash comes with, so proposing
         the hash means we matched the filling and missed the noun. */
      if (!onNoun.length && itemVocabulary(top.item).indexOf(headWord) === -1) {
        state.items.forEach(function (it) {
          if (it.is86 || it.servedToday === false) return;
          /* Never re-fetch something they ruled out: this lookup reads the
             whole menu, so it happily found the excluded dish again. */
          if (words(it.name).some(function (w) { return excluded[w]; })) return;
          if (words(it.name).indexOf(headWord) !== -1) onNoun.push(it);
        });
      }
      if (onNoun.length) {
        var withCombo = onNoun.slice(0, 4);
        describedBy(state, text).slice(0, 1).forEach(function (it) {
          if (withCombo.indexOf(it) === -1) withCombo.unshift(it);
        });
        return { intent: 'ambiguous', exact: false, options: withCombo.slice(0, 4) };
      }
    }

    /* Only a shared word, and other dishes share it -> ask which.
       DELIBERATELY NARROW, and it was widened once and had to come back:
       ONE matched word out of several is the mechanism every measured
       failure had. Firing on any partial match instead broke four things at
       once -- it pre-empted the exact-tie branch, and it turned three dishes
       whose full names people type ("Cold Soup - Cup") into questions. And
       it may not fire when a word is FOREIGN to the menu: "club sandwich"
       deserves "we do not have that", not a choice of three sandwiches. */
    if (!namedItOutright && top.hits === 1 && top.nameWords > 1 &&
        noForeignWords(state, text)) {
      var rivals = matches.filter(function (m) {
        return (m.matched || []).some(function (w) { return owners[w] > 1; });
      });
      /* THE LAST WORD IS THE NOUN. English compounds are head-final -- a cold
         soup is a soup, a steak burger is a burger -- so when several dishes
         are in the running, the ones that matched the HEAD word are the ones
         worth asking about. Without this, "cold soup" on a Thursday (the cold
         soup is Wednesday-only) offered a COLD CUT SANDWICH first, because
         "cold" is one word out of three there and one out of four in the
         soups. Ranking, not filtering, unless the head genuinely narrows it. */
      var said = words(text), head = null;
      for (var h = said.length - 1; h >= 0; h -= 1) {
        if (rivals.some(function (m) {
          return (m.matched || []).indexOf(said[h]) !== -1;
        })) { head = said[h]; break; }
      }
      if (head) {
        var onHead = rivals.filter(function (m) {
          return (m.matched || []).indexOf(head) !== -1;
        });
        if (onHead.length) rivals = onHead;
      }
      rivals = rivals.slice(0, 4);
      if (rivals.length > 1) {
        var opts = rivals.map(function (m) { return m.item; });
        /* A dish DESCRIBED but not named belongs in the question too -- and
           only in the question. It goes first because describing a Pick Combo
           in full is stronger evidence than sharing one word with three
           sandwiches. */
        describedBy(state, text).slice(0, 2).forEach(function (it) {
          if (opts.indexOf(it) === -1) opts.unshift(it);
        });
        return { intent: 'ambiguous', exact: false, options: opts.slice(0, 5) };
      }
    }

    /* A word nobody else uses IS the dish. An abbreviation we cannot place --
       "med", "kraut" -- must not veto it; it goes to the kitchen note like
       any other leftover. Without this, naming the dish perfectly and adding
       one shortening got "I do not see that on today's menu". */
    /* TWO SIGNALS OF DOUBT, SO ASK RATHER THAN ASSERT. "toast and jam"
       matched ONE word of "French Toast" and carried a word we cannot place
       at all -- and the parser proposed French Toast, which is the exact
       shape of the failure that started this ("french fries" -> French
       Toast). A FULL name match plus an unknown extra stays confident:
       "pancakes with blueberries" is pancakes, and the blueberries go to the
       kitchen note where the resident can see them. */
    var joined = conjoinedUnknown(state, text);
    if (joined && top.hits < top.nameWords) {
      return { intent: 'didyoumean', typed: joined,
               options: matches.slice(0, 3).map(function (m) { return m.item; }) };
    }

    if (notOnMenu && matches[0].score < 1 && !namedItOutright) {
      var nm0 = nearMisses(state, text);
      if (nm0.items.length) {
        return { intent: 'didyoumean', typed: nm0.typed, options: nm0.items };
      }
      return { intent: 'unknown', notOnMenu: notOnMenu };
    }

    // A near-tie is ambiguity, not a decision. Two dishes within a hair of
    // each other means the resident said something that fits both, and
    // picking one silently is how "cup" becomes "bowl" on a bill.
    /* HOW MUCH OF THE DISH THEY NAMED BREAKS A TIE. "vegetable stir fry"
       tied the one-word side "Vegetables" (1.100) against Vegetable Stir
       Fry (1.090), because the score is a FRACTION of each name and a
       one-word name is trivially complete. Three words named beats one
       named: it is more of the dish, not a closer fraction. */
    /* NOT A TIE IF WE DELIBERATELY LED WITH THE EARLIER DISH. The promotion
       above puts a LOWER-scoring match first on purpose, and this test reads
       "the second one scores higher" as a tie -- so "stroganoff and a side
       salad" was asked about instead of ordered, offering the second plate
       as though it were a rival reading of the first. */
    if (!leadPromoted && matches.length > 1 &&
        matches[1].score >= matches[0].score - 0.01 &&
        matches[1].hits >= matches[0].hits) {
      var tied = matches.filter(function (m) {
        return m.score >= matches[0].score - 0.01 && m.hits >= matches[0].hits;
      }).slice(0, 4);
      /* `exact` separates two very different ties, and the test is whether
         the tied rows are ONE DISH IN TWO SIZES -- which is what a shared
         leading name means. "Chef's Soup du Jour — Cup" and "— Bowl" share
         everything up to the dash, so the resident named the dish and only
         the size is open: "which one?". "Chicken Parmesan" ties Eggplant
         Parmesan against Chicken Shawarma against Roasted Chicken, which
         share nothing; telling that resident we heard them right would be a
         lie, so the UI says we do not have it exactly.

         Not a score threshold: real menu names carry words nobody says out
         loud ("Chef's", "Your Way"), so a perfectly-named dish scores well
         under 1 and a threshold would call every size tie inexact. */
      var names = tied.map(function (m) { return words(m.item.name); });
      var shared = 0;
      while (names[0] && shared < names[0].length &&
             names.every(function (n) { return n[shared] === names[0][shared]; })) {
        shared += 1;
      }
      return { intent: 'ambiguous', exact: shared > 0,
               options: tied.map(function (m) { return m.item; }) };
    }

    var item = matches[0].item;

    /* THE CONFIDENTLY-WRONG-PLATE CASE, found by testing: "beef wellington"
       matched "Beef Tenderloin" on the single word "beef" and was proposed as
       though understood. One word out of two is not enough evidence to assert
       a dish.

       But a blunt threshold would also reject "filet", which is a perfectly
       normal thing to say. So the test is not how MUCH matched -- it is
       whether the resident used a real word we could not place. "wellington"
       matches no dish and no option anywhere on the menu; "filet" leaves
       nothing unexplained.

       UPGRADED after Colin's first live message. Asking "did you mean Beef
       Tenderloin?" is fine when the guess is close, but the same branch also
       produced "did you mean French Toast?" for a hamburger and "did you mean
       Hot Tea?" for a hot dog. Offering the nearest-sounding dish to somebody
       who named something we do not serve is worse than useless -- it reads
       as though the machine is not listening. When a real word cannot be
       placed and no dish was fully named, SAY WE DO NOT HAVE IT, and name it
       back so they know which word was the problem. */
    /* (handled above, before the tie check -- kept here as the record of why
       the ordering matters) */

    var selections = extractSelections(item, text);
    var holds = unmatchedHolds(item, text, selections)
      .concat(leftoverRequests(item, text, selections));
    var t2 = norm(text);

    /* A SECOND DISH MUST NOT VANISH. "shawarma and french toast" proposed the
       French Toast and dropped the shawarma without a word -- the same
       silent-loss failure as the swallowed "no sauce", and on a whole dish.
       The chat takes one plate at a time on purpose (each needs its own
       options confirmed), so the honest move is to say what is being set
       aside, not to pretend it was never said.

       A dish only counts as a second one if it was named by a word the first
       dish did not use -- otherwise "Soup Cup" and "Soup Bowl" would look
       like two orders every time somebody says "soup". */
    var firstWords = {};
    words(item.name).forEach(function (w) { firstWords[w] = 1; });
    var alsoAsked = [];
    matches.slice(1).forEach(function (m) {
      /* 0.25 not 0.4: "filet mignon and a soup" scores the soup rows at
         0.29, because their full names carry words nobody says ("Chef's",
         "du Jour"). At 0.4 the second dish was still being dropped in
         silence, which is the whole thing this exists to stop. */
      if (m.score < 0.25) return;
      var own = words(m.item.name).filter(function (w) {
        /* A NUMBER WORD IS NOT EVIDENCE OF A SECOND DISH. "two coffees"
           flagged "Eggs Your Way -- Two Eggs" as also-asked, purely on the
           "two" that was the quantity. */
        return !STOP[w] && !NUMBER_WORD[w] && w.length > 2 &&
               !firstWords[w] && findWordish(t2, w) !== -1;
      });
      if (own.length && alsoAsked.indexOf(m.item.name) === -1) {
        alsoAsked.push(m.item.name);
      }
    });

    return {
      note: holds.join('; '),
      /* THE NUMBER MUST NOT BE COUNTED TWICE. "two eggs" is ONE order of the
         "Eggs Your Way -- Two Eggs" plate, not two of them: the "two" is part
         of the dish's own name. Reading it as a quantity served four eggs and
         billed for two plates. */
      qty: (function () {
        var n = spokenQuantity(text);
        if (n > 1) {
          var nameWords = {};
          words(item.name).forEach(function (w) { nameWords[w] = 1; });
          var spoken = words(text).filter(function (w) {
            return NUMBER_WORD[w] && NUMBER_WORD[w] === n;
          });
          if (spoken.length && spoken.every(function (w) { return nameWords[w]; })) return 1;
        }
        return n;
      }()),
      alsoAsked: alsoAsked.slice(0, 3),
      intent: 'order',
      item: item,
      selections: selections,
      missing: missingGroups(item, selections),
      heard: matches[0].score
    };
  }

  /* Does the utterance contain a significant word that appears nowhere in the
     menu -- not in a dish name, not in an option value, not in a description?
     Cached per state, because it walks the whole menu. */
  function menuVocabulary(state) {
    if (state._vocab) return state._vocab;
    var v = {};
    function add(str) {
      /* THREE, matching isUnplaceable's floor. These two numbers disagreed for
         one commit and it cost "ice cream": the vocabulary skipped words of
         three letters, so "ice" looked like a word we had never heard of and
         a dish that is plainly on the menu came back as "I do not see ice
         cream on today's menu". A vocabulary and the check that consults it
         have to agree about what counts as a word. */
      words(str).forEach(function (w) { if (w.length >= 3) v[w] = 1; });
    }
    state.items.forEach(function (it) {
      add(it.name);
      add(it.description);
      (it.options || []).forEach(function (g) {
        add(g.label);
        g.choices.forEach(function (c) {
          add((c && c.name !== undefined) ? c.name : c);
        });
      });
    });
    state._vocab = v;
    return v;
  }

  /* The thing the resident asked for that we do not have, for the reply to
     name back to them. Words already spent on an option are excluded -- in
     "hamburger cheddar no pickle medium with french fries", the answer is
     "hamburger", not "french fries". Returns '' when nothing stands out,
     because a vague reply beats a confidently wrong one. */
  /* Opening a sentence with one of these makes it a question ABOUT US, never
     an order: "why didnt you ask my sides", "how come nobody called". Nothing
     after them can be read back as a dish we were asked for. Kept separate
     from NOT_A_DISH and checked only at position 0, because "do you have
     lasagna" and "can i get a hamburger" are ordinary orders that happen to
     be phrased as questions -- those must still name the dish. */
  var OPENS_A_QUESTION = { why: 1, how: 1, what: 1, whats: 1, when: 1,
                           where: 1, who: 1, huh: 1 };

  function unmatchedDish(state, text) {
    var claimed = optionClaimedWords(state, norm(text));
    var all = words(text);
    for (var q = 0; q < all.length && q < 3; q += 1) {
      if (OPENS_A_QUESTION[all[q]]) return '';
      if (!STOP[all[q]] && !FILLER[all[q]] && !NOT_A_DISH[all[q]]) break;
    }
    var idx = [];
    all.forEach(function (w, i) {
