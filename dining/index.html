<html lang="en">
<head>

<title>Dining Room Ordering Demo &mdash; Browse or Order by Chat</title>
<meta name="description" content="A working ordering demo for a dining room: browse the real menu, or order by chat. Built by Automated Workflow, Gainesville FL.">
<link rel="canonical" href="https://automatedworkflowllc.com/dining/">
<meta name="robots" content="noindex,nofollow">
<!-- Deliberately out of organic search: a CLIENT demo hosted so it can be
     opened from any machine, not a page of ours to be found. Linked from
     nowhere on purpose. Same decision as /free-demo/. -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Courgette&display=swap" rel="stylesheet">
<style>
/* Oak Hammock ordering — brand tokens measured off oakhammock.org.
   Senior-first: 19px base, 48px+ touch targets, visible focus everywhere.
   Terracotta fails AA for small text on white, so it is reserved for large
   text, borders and fills behind white bold type; navy carries body text. */

:root {
  --terracotta: #DB7955;
  --terracotta-dark: #C05F3C;   /* LARGE text, borders, fills: 4.25:1 on white,
                                   which clears AA-large (3:1) but NOT AA (4.5) */
  --terracotta-text: #B25535;   /* small text on white/cream: 4.95 / 4.63 */
  --navy: #0E3050;
  --navy-soft: #1C4468;
  --cream: #FAF7F2;             /* page ground */
  --card: #FFFFFF;
  --line: #E5DDD2;
  --ok: #2F6B4F;
  --warn: #7E6013;            /* 4.98 on the closed-badge ground */
  --danger: #98283C;
}

* { box-sizing: border-box; }
html { font-size: 19px; }
body {
  margin: 0; background: var(--cream); color: var(--navy);
  font-family: Montserrat, "Segoe UI", system-ui, sans-serif;
  line-height: 1.55;
}
.wrap { max-width: 60rem; margin: 0 auto; padding: 1.2rem 1rem 4rem; }

/* header */
.topbar {
  background: var(--navy); color: #fff;
  padding: .6rem 1rem; display: flex; align-items: center; gap: 1rem;
  flex-wrap: wrap;
}
.topbar img { height: 52px; width: auto; display: block; }
.topbar .grow { flex: 1; }
.topbar a { color: #fff; text-decoration: none; font-weight: 600; padding: .55rem .9rem;
  border-radius: 50px; min-height: 48px; display: inline-flex; align-items: center; }
.topbar a:hover { background: var(--navy-soft); }
.topbar a.here { background: var(--terracotta); }

h1.script {
  font-family: Courgette, "Segoe Script", cursive;
  color: var(--terracotta-dark); font-weight: 400;
  font-size: 2.1rem; margin: 1rem 0 .4rem; text-wrap: balance;
}
h2 { font-size: 1.25rem; margin: 1.6rem 0 .6rem; }
.sub { color: #4A4538; margin: 0 0 1.2rem; }

/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 1rem; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: .8rem;
  padding: 1.1rem 1.2rem; display: flex; flex-direction: column; gap: .5rem;
}
.card h3 { margin: 0; font-size: 1.15rem; }
.card p { margin: 0; color: #4A4538; font-size: .95rem; }
.badge { display: inline-block; font-size: .8rem; font-weight: 700; border-radius: 50px;
  padding: .15rem .7rem; }
.badge.open { background: #E7F2EC; color: var(--ok); }
.badge.closed { background: #F3EBE0; color: var(--warn); }

/* buttons — pill shaped like the brand site, always ≥48px tall */
.btn, button.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 48px; padding: .5rem 1.3rem; border-radius: 50px;
  border: 2px solid transparent; cursor: pointer;
  font: 700 1rem Montserrat, sans-serif; text-decoration: none;
}
.btn.primary { background: var(--navy); color: #fff; }
.btn.primary:hover { background: var(--navy-soft); }
.btn.accent { background: var(--terracotta); color: #fff; font-size: 1.05rem; }
.btn.accent:hover { background: var(--terracotta-dark); }
.btn.quiet { background: #fff; color: var(--navy); border-color: var(--navy); }
.btn.quiet:hover { background: var(--cream); }
.btn.danger { background: #fff; color: var(--danger); border-color: var(--danger); }
.btn.small { min-height: 44px; padding: .3rem 1rem; font-size: .95rem; }
:focus-visible { outline: 3px solid var(--terracotta-dark); outline-offset: 2px; }

/* forms */
input[type=text], input[type=month], input[type=password], select, textarea {
  font: inherit; color: var(--navy); background: #fff;
  border: 2px solid var(--navy); border-radius: .6rem; padding: .6rem .8rem;
  min-height: 48px; width: 100%; max-width: 22rem;
}
label { font-weight: 700; display: block; margin: .8rem 0 .3rem; }
/* A .sub used INSIDE a label is an inline note ("(adds a $5.50 delivery
   fee)"), not a paragraph. Its 1.2rem bottom margin pushed it off the
   label's baseline and it read as floating above the option -- caught by
   Colin on the cart, 2026-08-20. Inline notes carry no block margin. */
label .sub { margin: 0; display: inline; font-weight: 600; }
/* One option per line, big target, note on the same baseline as the choice. */
label.radio { display: flex; align-items: center; gap: .7rem; font-weight: 600;
  margin: .5rem 0; padding: .35rem 0; cursor: pointer; }
label.radio input { width: 1.5rem; height: 1.5rem; flex-shrink: 0; margin: 0; }
.biginput { font-size: 1.5rem; letter-spacing: .06em; text-align: center; max-width: 14rem; }

/* menu rows */
/* Menu rows. Colin, 2026-08-20: "the numbers and text are stacked oddly
   sometimes" + "remember this is for old people". So: the price and the Add
   button live in ONE fixed right-hand column (.buy) that top-aligns with the
   item name instead of drifting to the vertical middle of a wrapped
   description, and on a narrow phone the row stacks deliberately rather
   than squeezing. Descriptions read at full size — no fine print here. */
.mrow { display: flex; gap: 1rem; align-items: flex-start; padding: .9rem 0;
  border-bottom: 1px solid var(--line); }
.mrow .info { flex: 1; min-width: 0; }
.mrow .name { font-weight: 700; font-size: 1.05rem; }
.mrow .desc { color: #4A4538; font-size: 1rem; }
.mrow .allergens { color: #6b5d3f; font-size: .95rem; margin-top: .15rem; }
.mrow .price { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums;
  font-size: 1.1rem; }
.mrow .buy { display: flex; flex-direction: column; align-items: flex-end;
  gap: .45rem; flex-shrink: 0; }
@media (max-width: 560px) {
  .mrow { flex-direction: column; gap: .5rem; }
  .mrow .buy { flex-direction: row; align-items: center; width: 100%;
    justify-content: space-between; }
}
.tag { display: inline-block; font-size: .85rem; font-weight: 700; border: 1px solid var(--ok);
  color: var(--ok); border-radius: .3rem; padding: 0 .35rem; margin-left: .3rem;
  vertical-align: 2px; }

/* notices */
.notice { background: #FDF3EC; border: 1px solid var(--terracotta);
  border-radius: .6rem; padding: .8rem 1rem; margin: 1rem 0; font-weight: 600; }
.notice.calm { background: #EDF3F8; border-color: var(--navy-soft); }

/* status steps */
.steps { list-style: none; margin: 1.2rem 0; padding: 0; }
.steps li { padding: .55rem 0 .55rem 2.4rem; position: relative; color: #6E685C; }
.steps li::before { content: ""; position: absolute; left: .55rem; top: .95rem;
  width: .9rem; height: .9rem; border-radius: 50%; background: var(--line); }
.steps li.done { color: var(--navy); font-weight: 600; }
.steps li.done::before { background: var(--ok); }
.steps li.now { color: var(--terracotta-text); font-weight: 800; font-size: 1.1rem; }
.steps li.now::before { background: var(--terracotta); }

/* staff queue */
.q { display: grid; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); gap: 1rem; }
.qcard { background: #fff; border: 2px solid var(--line); border-left: 8px solid var(--terracotta);
  border-radius: .7rem; padding: 1rem; }
.qcard.RECEIVED { border-left-color: var(--terracotta); }
.qcard.PREPARING { border-left-color: var(--warn); }
.qcard.READY, .qcard.OUT { border-left-color: var(--ok); }
.qcard h3 { margin: 0 0 .2rem; font-size: 1.05rem; }
.qcard ul { margin: .4rem 0; padding-left: 1.2rem; }
.qcard .meta { font-size: .85rem; color: #4A4538; }

table.plain { border-collapse: collapse; width: 100%; }
table.plain th, table.plain td { text-align: left; padding: .5rem .6rem;
  border-bottom: 1px solid var(--line); font-size: .95rem; }
table.plain td.num { text-align: right; font-variant-numeric: tabular-nums; }

.footer-note { margin-top: 3rem; font-size: .9rem; color: #6E685C; }  /* 5.17 */

/* --- hosted-demo additions (toasts, cart bar, motion) --- */
html { scroll-behavior: smooth; }
body { background: var(--cream); }
#app.fade-in { animation: ohfade .22s ease; }
@keyframes ohfade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.btn, .card, .qcard { transition: background .15s ease, transform .1s ease, box-shadow .15s ease; }
.btn:active { transform: scale(.97); }
.card:hover { box-shadow: 0 4px 14px rgba(14,48,80,.08); }
.toast {
  position: fixed; left: 50%; bottom: 1.4rem; transform: translate(-50%, 1rem);
  background: var(--navy); color: #fff; font-weight: 700;
  padding: .8rem 1.4rem; border-radius: 50px; opacity: 0;
  transition: opacity .25s ease, transform .25s ease; z-index: 50;
  max-width: min(92vw, 34rem); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.cartbar {
  position: sticky; bottom: 1rem; margin-top: 1.4rem;
  background: #fff; border: 2px solid var(--navy); border-radius: 50px;
  padding: .5rem .6rem .5rem 1.4rem; display: flex; align-items: center;
  justify-content: space-between; gap: 1rem; box-shadow: 0 6px 18px rgba(14,48,80,.14);
  font-size: 1.05rem;
}
.pill {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--terracotta); color: #fff; border-radius: 50px;
  min-width: 1.5rem; height: 1.5rem; font-size: .85rem; padding: 0 .35rem;
}
h3.sec { margin: .9rem 0 .1rem; color: #4A4538; font-size: 1rem;
  text-transform: uppercase; letter-spacing: .06em; }
form.inline label { display: inline; }
form.inline input { width: auto; }
fieldset.optgroup { border: 1px solid var(--line); border-radius: .7rem;
  padding: .6rem 1rem 1rem; margin: 1rem 0; background: #fff; }
fieldset.optgroup legend { font-weight: 800; padding: 0 .4rem; font-size: 1.05rem; }
fieldset.optgroup.needs { border-color: var(--danger); border-width: 2px;
  background: #FDF4F6; }
.req { color: var(--danger); font-weight: 700; font-size: .85rem;
  text-transform: uppercase; letter-spacing: .04em; }
.allergens.declared { color: #7a3320; font-weight: 700; }
.allergens .src { font-weight: 400; color: #6E685C; }
.allow { background: #EDF3F8; border: 1px solid var(--navy-soft);
  border-radius: .6rem; padding: .8rem 1.1rem; margin: 0 0 1.2rem;
  font-size: 1.05rem; }
.allow.over { background: #FDF3EC; border-color: var(--terracotta); }
.allow.unknown { background: #fff; border-color: var(--line); }
.allow strong { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.allow .basis { color: #4A4538; font-size: .9rem; font-weight: 400; }
.allow .bar { display: block; height: .5rem; border-radius: 50px;
  background: #D8E3EC; margin-top: .55rem; overflow: hidden; }
.allow .bar i { display: block; height: 100%; background: var(--navy);
  border-radius: 50px; }
p.sub .basis { color: #6E685C; font-size: .9rem; }
.mrow.gone { opacity: .72; }
.mrow.gone .name { text-decoration: line-through; }
.goneflag { color: var(--danger); font-weight: 700; font-size: .9rem; }
.card.chatcard { border-color: var(--terracotta); border-width: 2px; }
.chatnudge { background: #EDF3F8; border: 1px solid var(--navy-soft);
  border-radius: .6rem; padding: .7rem 1rem; margin: 0 0 1.2rem;
  font-size: 1.02rem; font-weight: 600; }
.tag.special { border-color: var(--terracotta-text); color: var(--terracotta-text); }
.chatbox { border: 1px solid var(--line); border-radius: .8rem; background: #fff;
  padding: 1rem; max-height: 58vh; overflow-y: auto; display: flex;
  flex-direction: column; gap: .6rem; }
/* On a phone the keyboard eats most of the screen, so a fixed-height scroller
   becomes a sliver and replies land out of sight -- which reads as "the chat
   is not working". Let the PAGE scroll instead, and give the input and the
   send button the full width. */
@media (max-width: 640px) {
  .chatbox { max-height: none; overflow-y: visible; padding: .75rem; }
  .bub { max-width: 100%; }
  form[data-form="chat"] input { max-width: 100%; font-size: 1.05rem; }
  form[data-form="chat"] .btn.primary { width: 100%; }
  .chip { display: block; width: 100%; text-align: left; margin: .35rem 0 0; }
}
.bub { max-width: 42rem; padding: .7rem 1rem; border-radius: 1rem; line-height: 1.5; }
.bub.bot { background: #EDF3F8; border-bottom-left-radius: .25rem; align-self: flex-start; }
.bub.you { background: var(--navy); color: #fff; border-bottom-right-radius: .25rem;
  align-self: flex-end; }
.bub.you a { color: #cfe2f3; }
.chip { display: inline-block; margin: .3rem .3rem 0 0; padding: .5rem 1rem;
  min-height: 44px; border-radius: 50px; border: 2px solid var(--navy);
  background: #fff; color: var(--navy); font: 700 .95rem Montserrat, sans-serif;
  cursor: pointer; }
.chip:hover { background: var(--navy); color: #fff; }
@media (prefers-reduced-motion: reduce) {
  #app.fade-in { animation: none; }
  .btn:active { transform: none; }
  html { scroll-behavior: auto; }
}

</style>

<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">Dining room ordering demo</h1>
<div id="hdr"></div>
<main class="wrap"><div id="app"></div></main>
<script>window.OH_REMOTE_CHAT={url:"https://oakhammock-chat.automaticworkflowllc.workers.dev/",passphrase:"oh-56104b2c106b",timeoutMs:20000};</script>
<script>
/* Oak Hammock ordering engine -- the browser port.
 *
 * WHY THIS FILE EXISTS. db.py is the FastAPI engine and needs a server. The
 * hosted demo has no server, so the same rules had to be expressed again in
 * JavaScript. Two implementations of one rulebook is the skeleton
 * three-copies trap, so this file is arranged to fail loudly instead of
 * drifting quietly:
 *
 *   - it is the ONLY copy of the browser rules (the page does not carry its
 *     own; build_static.py inlines THIS text and asserts the match),
 *   - test_engine.js runs the same findings-level cases the Python suite runs,
 *     ported one for one, so a rule that changes on one side and not the other
 *     shows up as a failure rather than as two demos that disagree.
 *
 * Everything here is pure: it takes a state object and returns or mutates it.
 * No DOM, no storage, no clock of its own -- callers pass `now`. That is what
 * lets the test suite drive it directly.
 *
 * The rules, unchanged from db.py:
 *   - An apartment number is an IDENTITY, not a display string.
 *   - Money is integer cents end to end.
 *   - Order status is a MACHINE; illegal jumps throw.
 *   - A month total is computed from exactly the rows it lists.
 */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.OH = api;
}(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ------------------------------------------------------------ identity */

  /* Canonical form of an apartment number: the IDENTITY the account keys on.
     Uppercase, whitespace and hyphens removed -- so "b 12", "B-12" and "B12"
     are one account. Deliberately nothing fancier: no zero-padding, no prefix
     guessing. "101" and "B101" stay different apartments, because inventing an
     equivalence between distinct units is worse than missing one. */
  function canonApartment(raw) {
    return String(raw == null ? '' : raw).replace(/[\s\-]+/g, '').toUpperCase();
  }

  /* Colin, 2026-08-20 and again 2026-08-21: a tower number is
     [floor][building][room][room] and the SECOND digit is the building, only
     ever 1 or 2. The building is IN the number, so it is read, never stored
     beside it -- two copies is how they come to disagree. */
  var TOWER_RE = /^(\d)([12])(\d{2})$/;

  function parseTowerApartment(raw) {
    var m = TOWER_RE.exec(canonApartment(raw));
    if (!m) return null;
    return { floor: +m[1], building: +m[2], room: +m[3] };
  }

  /* A HEADING IS AN IDENTITY, NOT A DISPLAY STRING. The staff form's default
     meal period was typed with a CURLY apostrophe ("Today’s Specials") while
     menu_data.py uses a straight one, so a special added through the
     kitchen's own form appeared under a SECOND "Today's Specials" heading
     further down the same page -- visually identical to the first, and the
     resident had to scroll past one to find the other.

     This is the same trap that cost three defects on customer names, so it
     gets the same treatment and the same rule: group on the normalised key,
     DISPLAY the spelling the kitchen actually used. It lives here rather than
     in ui.js because an identity rule with two copies is an identity rule
     waiting to disagree. Punctuation only -- it deliberately does NOT strip
     words, because "Lunch" and "Lunch & Dinner" are different services. */
  function groupKey(s) {
    return String(s == null ? '' : s)
      .replace(/[‘’ʼ′]/g, "'")
      .replace(/[“”]/g, '"')
      .replace(/[–—]/g, '-')
      .replace(/\s+/g, ' ')
      .trim().toLowerCase();
  }

  /* WHICH NAVIGATION A SCREEN WEARS. Pure, so it can be tested: takes the
     route and who is signed in, returns 'resident', 'staff' or 'none'.

     This used to be an inline resident-first check in ui.js, so anyone who
     signed in as a resident and THEN used Staff sign-in got the kitchen board
     wearing "Order Food · Chat · My Cart · My Orders · Sign out (3112)" --
     and that is exactly the demo path: show the resident side, then show the
     kitchen side. The bar belongs to the screen you are on, not the person
     you last were. */
  function navAudience(hash, hasResident, isStaff) {
    var onStaff = String(hash || '').indexOf('#/staff') === 0;
    if (onStaff && isStaff) return 'staff';
    if (hasResident) return 'resident';
    if (isStaff) return 'staff';
    return 'none';
  }

  /* ------------------------------------------------------- today's line up
   *
   * Colin, 2026-08-22: "a section in the staff portion that allows us to
   * change quiches, soups, fresh, sotw, healthy choice, and vegetable and
   * starch of the moment, fish sandwich, desserts and chef specials. NOT TO
   * ADD NEW BUT TO CHANGE THE CURRENT."
   *
   * That last sentence is the design. These are SLOTS -- a fixed set of
   * things the kitchen refills each day -- and the rotating-menu model here
   * is already built on them: a slot is the identity, the name is only what
   * happens to be in it today. So this edits the occupant and never creates
   * a row, which is also why renaming today's special cannot break the
   * allergen table or the option groups: both are keyed by slot, not by name.
   */

  /* The real MENU ITEMS filling a slot -- staff edit the dish itself. */
  function slotOccupants(state, slotKey) {
    return state.items.filter(function (it) { return it.slot === slotKey; });
  }

  /* Change what is in a slot today. Deliberately narrow: name, price and
     description, nothing else. It cannot move an item between slots, cannot
     create one, and cannot delete one. */
  function updateSlotItem(state, itemId, patch) {
    var it = itemById(state, itemId);
    if (!it) throw new Error('no such item');
    if (!it.slot) throw new Error('that dish is not part of the daily line up');

    if (patch.name !== undefined) {
      var nm = String(patch.name).trim();
      if (!nm) throw new Error('a dish needs a name');
      it.name = nm.slice(0, 80);
    }
    if (patch.description !== undefined) {
      it.description = String(patch.description).trim().slice(0, 300);
    }
    if (patch.priceCents !== undefined && patch.priceCents !== null) {
      var c = patch.priceCents;
      /* Money stays integer cents. A BLANK price means "leave it alone",
         which is not the same as zero -- zero is what the priced-by-the-day
         items legitimately use. */
      if (typeof c !== 'number' || !isFinite(c) || c !== Math.round(c) || c < 0) {
        throw new Error('a price must be a whole number of cents');
      }
      if (c > 100000) throw new Error('that price looks wrong');
      it.priceCents = c;
    }
    return it;
  }

  /* Slots with no menu row of their own -- "Vegetable of the moment",
     "Starch of the moment", the quiches, the rolls. They are not dishes you
     order; they are TODAY'S WORDING for something that appears elsewhere (the
     sides picker literally offers "Vegetable of the moment"). Held as text on
     the state so the kitchen can set them without inventing menu rows. */
  function lineupText(state, slotKey) {
    return (state.lineupText && state.lineupText[slotKey]) || '';
  }

  function setLineupText(state, slotKey, value) {
    if (!state.lineupText) state.lineupText = {};
    state.lineupText[slotKey] = String(value == null ? '' : value).trim().slice(0, 140);
    return state.lineupText[slotKey];
  }

  /* COLIN, 2026-08-22: "on Wednesdays there is a cold soup." So it is a real
     part of the rotation that runs one day a week. A day-gated item is ABSENT
     on the other six days rather than 86'd -- 86 means the kitchen ran out,
     and telling a resident on a Tuesday that the cold soup is sold out would
     be a small lie. */
  var WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday',
                  'Friday', 'Saturday'];

  function dayName(now) { return WEEKDAYS[(now || new Date()).getDay()]; }

  function servedToday(item, now) {
    if (!item.days || !item.days.length) return true;
    return item.days.indexOf(dayName(now)) !== -1;
  }

  /* PUT THE RIGHT DAY'S DISHES UP. Colin, 2026-08-22: "Today is Saturday are
     you sure you have the right dishes on there" -- and it was not: the
     rotating slots still held Thursday's line up, transcribed from the 8/20
     sheet, with nothing to move them on. This is the automation he asked for
     in the first place: the kitchen writes the weekly card once, and each day
     is a slice of it.

     THE DECLARED ALLERGENS ARE CLEARED WHEN THE DISH CHANGES, and that is the
     part that matters. They are keyed by SLOT, and chef_special_1's were the
     Chicken Shawarma's -- the kitchen's own word about one specific plate.
     Let them ride onto Beef Stroganoff and the page states as FACT an
     allergen nobody declared for that dish. The weekly card carries no
     allergen column, so after a swap there is no kitchen statement to show:
     the scan falls back to what the description implies, rendered as "may
     contain". That is exactly what the three tiers are for. */
  function applyWeeklyLineup(state, now) {
    var week = state.weeklyEntrees;
    var day = dayName(now);
    if (!week) return { covered: false, day: day, reason: 'no weekly card' };
    var plan = week[day];
    if (!plan) {
      /* Monday to Wednesday sit on a page that was never photographed. An
         uncovered day leaves the existing dishes alone rather than inventing
         any, and SAYS it is uncovered so the staff screen can say so too. */
      return { covered: false, day: day, reason: 'not on this week’s card' };
    }

    var slots = ['chef_special_1', 'chef_special_2'];
    var changed = [];
    (plan.entrees || []).forEach(function (pair, i) {
      var key = slots[i];
      if (!key) return;
      slotOccupants(state, key).forEach(function (it) {
        if (it.name !== pair[0]) {
          it.name = pair[0];
          it.priceCents = pair[1];
          it.description = '';
          it.allergens = [];        // see the note above -- not this dish's
          changed.push(key + ': ' + pair[0]);
        }
      });
    });

    if (plan.soup) {
      var line = 'Today: ' + plan.soup + '.';
      slotOccupants(state, 'soup_daily').forEach(function (it) {
        if (it.description === line) return;
        it.description = line;
        /* SAME REASON AS THE SPECIALS ABOVE, and easier to miss because the
           soup's NAME never changes -- only what is in the pot. The declared
           milk and pepper belonged to Thursday's vegetable barley; carrying
           them onto a Tuscan white bean states the kitchen's word about a
           soup the kitchen never said it about. */
        it.allergens = [];
      });
    }
    state.lineupDay = day;
    return { covered: true, day: day, changed: changed, soup: plan.soup || '' };
  }

  function describeApartment(raw, area) {
    var t = parseTowerApartment(raw);
    if (t) {
      return 'Building ' + t.building + ', floor ' + t.floor + ', room ' +
             (t.room < 10 ? '0' + t.room : t.room);
    }
    return ((area || '') + ' ' + raw).trim();
  }

  /* Everyone whose number matches. USUALLY one -- but villa numbers collide
     with apartment numbers, and the number is believed to BE the billing
     account, so a match of two is an ambiguity to ASK about, never to
     resolve. Returns a list so the caller must face it. */
  function findResidents(state, rawApartment) {
    var key = canonApartment(rawApartment);
    if (!key) return [];
    return state.residents.filter(function (r) {
      return r.apartmentKey === key;
    }).sort(function (a, b) {
      return (a.area || '') < (b.area || '') ? -1 : 1;
    });
  }

  /* The unambiguous case only: null when nobody matches OR when more than one
     does. A caller that cannot ask a human must not be handed a coin flip. */
  function findResident(state, rawApartment) {
    var all = findResidents(state, rawApartment);
    return all.length === 1 ? all[0] : null;
  }

  /* -------------------------------------------------------------- venues */

  function parseHHMM(s) {
    var p = String(s).split(':');
    return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
  }

  /* Open/closed from the venue's daily windows. Informational in the demo
     (the badge); production would also gate ordering on it. */
  function isOpen(hours, now) {
    var minutes = now.getHours() * 60 + now.getMinutes();
    for (var i = 0; i < hours.length; i++) {
      if (parseHHMM(hours[i][0]) <= minutes && minutes < parseHHMM(hours[i][1])) return true;
    }
    return false;
  }

  function venuesWithState(state, now) {
    return state.venues.map(function (v) {
      var o = {};
      for (var k in v) if (Object.prototype.hasOwnProperty.call(v, k)) o[k] = v[k];
      o.openNow = isOpen(v.hours, now);
      return o;
    });
  }

  function itemById(state, itemId) {
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].id === itemId) return state.items[i];
    }
    return null;
  }

  function venueBySlug(state, slug) {
    for (var i = 0; i < state.venues.length; i++) {
      if (state.venues[i].slug === slug) return state.venues[i];
    }
    return null;
  }

  /* ---------------------------------------------------------------- cart */

  function cartOf(state, residentId) {
    if (!state.carts[residentId]) state.carts[residentId] = [];
    return state.carts[residentId];
  }

  /* ------------------------------------------------------------- options */

  /* Validate a resident's choices against the item's own option groups.
     Colin, 2026-08-20: "all the signature selections come with a choice of 2
     sides" and "try to imagine the experience end to end of what the customer
     would need to fully give their order". So the choices are STRUCTURED --
     the kitchen reads picked values, not a paragraph someone typed. Rules:
       - a "choice" group needs exactly one value, and it must be on the list
       - a "multi" group allows up to `max`, each on the list
       - a value that is not on the list is REFUSED, never passed through:
         an unknown side reaching the line is a plate the kitchen cannot make
     Returns the normalised selections; throws with a resident-readable
     message naming the group that is wrong. */
  /* A choice is either a plain string (free) or {name, price_cents} -- the
     printed card charges for some of them ("+$1 asparagus", "+$0.25 bacon"),
     and a demo that silently ignores a stated surcharge is a demo that
     under-bills. These two helpers are the only place that distinction
     lives. */
  function choiceName(c) { return (c && c.name !== undefined) ? c.name : c; }

  function choicePrice(group, name) {
    for (var i = 0; i < group.choices.length; i++) {
      var c = group.choices[i];
      if (choiceName(c) === name) return (c && c.price_cents) || 0;
    }
    return 0;
  }

  /* What the selected extras add to this line, in cents. */
  function extrasCents(item, selections) {
    var groups = (item && item.options) || [];
    var total = 0;
    for (var g = 0; g < groups.length; g++) {
      var picked = (selections || {})[groups[g].label] || [];
      for (var i = 0; i < picked.length; i++) {
        total += choicePrice(groups[g], picked[i]);
      }
    }
    return total;
  }

  function validateSelections(item, selections) {
    var groups = item.options || [];
    var out = {};
    selections = selections || {};
    for (var g = 0; g < groups.length; g++) {
      var grp = groups[g];
      var picked = selections[grp.label];
      if (picked == null) picked = [];
      if (!Array.isArray(picked)) picked = [picked];
      var names = grp.choices.map(choiceName);
      for (var i = 0; i < picked.length; i++) {
        if (names.indexOf(picked[i]) === -1) {
          throw new Error('"' + picked[i] + '" is not a choice for ' + grp.label);
        }
      }
      if (grp.type === 'choice') {
        if (picked.length !== 1) {
          throw new Error('Please choose ' + grp.label.toLowerCase() +
                          ' for ' + item.name + '.');
        }
      } else {
        var max = grp.max || grp.choices.length;
        if (picked.length > max) {
          throw new Error('Choose at most ' + max + ' for ' + grp.label + '.');
        }
      }
      out[grp.label] = picked;
    }
    return out;
  }

  /* Two lines of the same dish with DIFFERENT choices are different lines --
     one steak with fries and one with broccoli must not merge into "x2". */
  function selectionKey(selections) {
    var keys = Object.keys(selections || {}).sort();
    return keys.map(function (k) {
      return k + '=' + (selections[k] || []).join('|');
    }).join(';');
  }

  function describeSelections(selections, itemNote) {
    var keys = Object.keys(selections || {});
    var parts = [];
    for (var i = 0; i < keys.length; i++) {
      var v = selections[keys[i]];
      if (v && v.length) parts.push(keys[i] + ': ' + v.join(', '));
    }
    if (itemNote) parts.push('Note: ' + itemNote);
    return parts.join(' · ');
  }

  /* Add one of an item. ONE VENUE PER ORDER: adding from a second venue is
     refused here so the UI can offer "clear and start over" instead of letting
     a mixed cart reach the kitchen. */
  function cartAdd(state, residentId, itemId, selections, itemNote) {
    var item = itemById(state, itemId);
    if (!item) throw new Error('no such item');
    if (item.is86) throw new Error("'" + item.name + "' is not available right now");
    var chosen = validateSelections(item, selections);
    /* The free-text escape hatch. Colin, 2026-08-20: "for bonnie blue salad,
       no walnuts ... for now just let them type it out i guess". The pickers
       cover what the menu states; this covers what it does not, and it is
       part of the LINE (two otherwise-identical plates with different notes
       are different plates), not a paragraph bolted onto the whole order. */
    var note = String(itemNote || '').trim().slice(0, 140);
    var key = selectionKey(chosen) + '#' + note;
    var cart = cartOf(state, residentId);
    if (cart.length) {
      var first = itemById(state, cart[0].itemId);
      if (first && first.venueSlug !== item.venueSlug) {
        throw new Error('cart holds items from another venue');
      }
    }
    for (var i = 0; i < cart.length; i++) {
      if (cart[i].itemId === itemId &&
          selectionKey(cart[i].selections) + '#' + (cart[i].itemNote || '') === key) {
        cart[i].qty += 1;
        return;
      }
    }
    cart.push({ itemId: itemId, qty: 1, selections: chosen, itemNote: note });
  }

  function cartRemove(state, residentId, itemId, selKey) {
    var cart = cartOf(state, residentId);
    for (var i = 0; i < cart.length; i++) {
      if (cart[i].itemId === itemId &&
          (selKey === undefined ||
           selectionKey(cart[i].selections) + '#' + (cart[i].itemNote || '') === selKey)) {
        if (cart[i].qty > 1) cart[i].qty -= 1;
        else cart.splice(i, 1);
        return;
      }
    }
  }

  function cartClear(state, residentId) {
    state.carts[residentId] = [];
  }

  /* Rows joined to their items, plus the line total. Sorted by the item's own
     sort key so the cart reads in menu order, same as the Python side. */
  function cartContents(state, residentId) {
    var cart = cartOf(state, residentId);
    var rows = [];
    for (var i = 0; i < cart.length; i++) {
      var it = itemById(state, cart[i].itemId);
      if (!it) continue;
      rows.push({
        itemId: it.id, qty: cart[i].qty, name: it.name,
        selections: cart[i].selections || {},
        itemNote: cart[i].itemNote || '',
        selectionKey: selectionKey(cart[i].selections) + '#' + (cart[i].itemNote || ''),
        selectionText: describeSelections(cart[i].selections, cart[i].itemNote),
        priceCents: it.priceCents + extrasCents(it, cart[i].selections),
        basePriceCents: it.priceCents,
        extrasCents: extrasCents(it, cart[i].selections),
        is86: it.is86, sort: it.sort,
        venueSlug: it.venueSlug, venueName: (venueBySlug(state, it.venueSlug) || {}).name || ''
      });
    }
    rows.sort(function (a, b) { return a.sort - b.sort; });
    var total = 0;
    for (var j = 0; j < rows.length; j++) total += rows[j].priceCents * rows[j].qty;
    return { rows: rows, total: total };
  }

  /* -------------------------------------------------------------- orders */

  var RECEIVED = 'RECEIVED', PREPARING = 'PREPARING', READY = 'READY',
      OUT = 'OUT', COMPLETED = 'COMPLETED', CANCELLED = 'CANCELLED';

  /* Colin, 2026-08-20. Pickup is free; the fee is stamped onto the order at
     placement (never recomputed), charged with the order, voided with it. */
  var DELIVERY_FEE_CENTS = 550;

  /* The status machine. READY is the pickup branch, OUT the delivery branch,
     so a pickup order can never be marked "out for delivery". COMPLETED and
     CANCELLED are terminal by ABSENCE from this map. */
  var NEXT = {
    'RECEIVED|pickup': PREPARING, 'RECEIVED|delivery': PREPARING,
    'PREPARING|pickup': READY, 'PREPARING|delivery': OUT,
    'READY|pickup': COMPLETED, 'OUT|delivery': COMPLETED
  };

  var STATUS_LABEL = {
    RECEIVED: 'Received — the kitchen has your order',
    PREPARING: 'In the kitchen',
    READY: 'Ready for pickup',
    OUT: 'On its way to you',
    COMPLETED: 'Delivered — enjoy!',
    CANCELLED: 'Cancelled'
  };

  function isoSeconds(now) {
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return now.getFullYear() + '-' + p(now.getMonth() + 1) + '-' + p(now.getDate()) +
      'T' + p(now.getHours()) + ':' + p(now.getMinutes()) + ':' + p(now.getSeconds());
  }

  /* Turn the cart into an order plus EXACTLY ONE charge. Rejects an empty
     cart, a mixed-venue cart (belt to cartAdd's suspenders) and any 86'd item
     that slipped in while the cart sat there. */
  /* WHAT TIME WOULD YOU LIKE IT? Colin, 2026-08-22: "set orders today be able
     to pick d up or delivered at a specific time as well."

     The slots are generated from the VENUE'S OWN HOURS rather than a fixed
     list, so a demo cannot offer a 7pm delivery from a kitchen that closed at
     six. Fifteen-minute steps, and the first one is LEAD_MINUTES out --
     offering "in five minutes" is a promise the kitchen has not agreed to. */
  var SLOT_STEP_MINUTES = 15;
  var LEAD_MINUTES = 30;

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function prettyTime(hhmm) {
    var p = String(hhmm).split(':');
    var h = parseInt(p[0], 10), m = parseInt(p[1], 10);
    var ap = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12; if (!h12) h12 = 12;
    return h12 + ':' + pad2(m) + ' ' + ap;
  }

  function timeSlots(venue, now) {
    var out = [];
    if (!venue || !venue.hours) return out;
    var minsNow = now.getHours() * 60 + now.getMinutes();
    var earliest = minsNow + LEAD_MINUTES;
    venue.hours.forEach(function (win) {
      var open = parseHHMM(win[0]), close = parseHHMM(win[1]);
      var first = Math.max(open, earliest);
      // round up to the next quarter hour
      first = Math.ceil(first / SLOT_STEP_MINUTES) * SLOT_STEP_MINUTES;
      for (var t = first; t <= close; t += SLOT_STEP_MINUTES) {
        var hhmm = pad2(Math.floor(t / 60)) + ':' + pad2(t % 60);
        out.push({ value: hhmm, label: prettyTime(hhmm) });
      }
    });
    return out;
  }

  function placeOrder(state, residentId, fulfillment, note, now, wantedAt) {
    if (fulfillment !== 'delivery' && fulfillment !== 'pickup') {
      throw new Error('fulfillment must be delivery or pickup');
    }
    var c = cartContents(state, residentId);
    if (!c.rows.length) throw new Error('cart is empty');
    var slugs = {};
    for (var i = 0; i < c.rows.length; i++) slugs[c.rows[i].venueSlug] = 1;
    if (Object.keys(slugs).length !== 1) throw new Error('one venue per order');
    /* A REQUESTED TIME IS CHECKED AGAINST THE SLOTS WE ACTUALLY OFFERED.
       Empty means as soon as possible, which is the default and always
       legal. Anything else has to be a time this venue is open and far
       enough out for the kitchen to make it -- otherwise the resident gets a
       confirmation for a delivery that cannot happen. */
    var wanted = String(wantedAt || '').trim();
    if (wanted) {
      var venueForTime = venueBySlug(state, c.rows[0].venueSlug);
      var legal = timeSlots(venueForTime, now || new Date());
      var ok = legal.some(function (sl) { return sl.value === wanted; });
      if (!ok) {
        throw new Error('the kitchen cannot promise ' + prettyTime(wanted) +
                        ' today — please pick one of the times offered');
      }
    }

    var dead = c.rows.filter(function (r) { return r.is86; })
                     .map(function (r) { return r.name; });
    if (dead.length) throw new Error('no longer available: ' + dead.join(', '));

    var ts = isoSeconds(now);
    var fee = fulfillment === 'delivery' ? DELIVERY_FEE_CENTS : 0;
    var order = {
      id: state.nextOrderId++,
      residentId: residentId,
      venueSlug: c.rows[0].venueSlug,
      status: RECEIVED,
      fulfillment: fulfillment,
      wantedAt: wanted,          // '' = as soon as possible
      feeCents: fee,
      note: String(note || '').trim(),
      createdAt: ts,
      updatedAt: ts,
      items: c.rows.map(function (r) {
        return { itemId: r.itemId, name: r.name, priceCents: r.priceCents,
                 qty: r.qty, selections: r.selections, itemNote: r.itemNote,
                 selectionText: r.selectionText };
      })
    };
    state.orders.push(order);
    state.charges.push({
      orderId: order.id, residentId: residentId, kind: 'charge',
      amountCents: c.total + fee, createdAt: ts
    });
    cartClear(state, residentId);
    return order.id;
  }

  function orderById(state, orderId) {
    for (var i = 0; i < state.orders.length; i++) {
      if (state.orders[i].id === orderId) return state.orders[i];
    }
    return null;
  }

  function orderTotal(order) {
    var t = order.feeCents || 0;
    for (var i = 0; i < order.items.length; i++) {
      t += order.items[i].priceCents * order.items[i].qty;
    }
    return t;
  }

  /* Staff taps "advance": move ONE legal step along the machine. Anything off
     the map throws -- that is what makes COMPLETED and CANCELLED terminal. */
  function advanceStatus(state, orderId, now) {
    var o = orderById(state, orderId);
    if (!o) throw new Error('no such order');
    var key = o.status + '|' + o.fulfillment;
    if (!Object.prototype.hasOwnProperty.call(NEXT, key)) {
      throw new Error('cannot advance an order in status ' + o.status);
    }
    o.status = NEXT[key];
    o.updatedAt = isoSeconds(now);
    return o.status;
  }

  /* Residents may cancel only while the kitchen has not started (RECEIVED);
     staff may cancel anything not already terminal. Cancelling VOIDS the
     charge -- the ledger must show zero net for a cancelled order. */
  function cancelOrder(state, orderId, byStaff, now) {
    var o = orderById(state, orderId);
    if (!o) throw new Error('no such order');
    if (o.status === COMPLETED || o.status === CANCELLED) {
      throw new Error('order is already ' + o.status.toLowerCase());
    }
    if (!byStaff && o.status !== RECEIVED) {
      throw new Error('the kitchen has started on this one — call the venue');
    }
    var ts = isoSeconds(now);
    o.status = CANCELLED;
    o.updatedAt = ts;
    /* POST A REVERSAL, do not delete. Net is still zero, but the history
       survives -- a resident asking six weeks later why their bill changed,
       or an office reconciling a month, has something to look at. */
    var orig = null;
    for (var i = 0; i < state.charges.length; i++) {
      if (state.charges[i].orderId === orderId &&
          state.charges[i].kind !== 'reversal') { orig = state.charges[i]; }
    }
    var already = state.charges.some(function (ch) {
      return ch.orderId === orderId && ch.kind === 'reversal';
    });
    if (orig && !already) {
      /* THE REVERSAL BOOKS AGAINST THE MONTH OF THE CHARGE IT REVERSES.
         Stamping it with "now" put a 31 August charge and its 2 September
         reversal in different invoice months: August billed a meal that was
         cancelled and never delivered, and September opened at MINUS $3.50,
         so the banner offered more allowance than the resident has. A
         reversal is not a new transaction, it is the same one undone.
         reversedAt keeps when it actually happened, so the audit trail --
         which is the whole reason we reverse instead of delete -- is intact. */
      state.charges.push({
        orderId: orderId, residentId: orig.residentId, kind: 'reversal',
        amountCents: -orig.amountCents, createdAt: orig.createdAt,
        reversedAt: ts
      });
    }
  }

  function residentOrders(state, residentId) {
    return state.orders.filter(function (o) { return o.residentId === residentId; })
      .slice().sort(function (a, b) { return b.id - a.id; });
  }

  function activeOrders(state, venueSlug) {
    return state.orders.filter(function (o) {
      if (o.status === COMPLETED || o.status === CANCELLED) return false;
      return !venueSlug || o.venueSlug === venueSlug;
    }).slice().sort(function (a, b) { return a.id - b.id; });
  }

  /* Refill the cart from a past order. Items that vanished or are 86'd are
     skipped and NAMED, so "order again" never silently orders less than it
     says it did. */
  function reorderIntoCart(state, residentId, orderId) {
    /* LOOK IT UP BEFORE DESTROYING ANYTHING. This cleared the cart first and
       then returned [] for an order that did not exist -- so a resident who
       tapped a stale "order this again" on a page rendered before a reset
       lost the cart they were building, silently, while the UI said "Back in
       your cart." An empty [] means "nothing was skipped", which made the
       failure indistinguishable from success.
       Ownership is checked here too: app.py already checks it at its route,
       and the engine should not be the weaker of the two. */
    var o = orderById(state, orderId);
    if (!o) throw new Error('that order is no longer available');
    if (o.residentId !== residentId) throw new Error('that order belongs to someone else');
    cartClear(state, residentId);
    var skipped = [];
    for (var i = 0; i < o.items.length; i++) {
      var line = o.items[i];
      var item = line.itemId ? itemById(state, line.itemId) : null;
      if (!item || item.is86) { skipped.push(line.name); continue; }
      for (var q = 0; q < line.qty; q++) {
        cartAdd(state, residentId, item.id, line.selections, line.itemNote);
      }
    }
    return skipped;
  }

  /* ------------------------------------------------------------- billing */

  function residentById(state, residentId) {
    for (var i = 0; i < state.residents.length; i++) {
      if (state.residents[i].id === residentId) return state.residents[i];
    }
    return null;
  }

  /* All charges for "YYYY-MM", joined for the invoice run. Any month total
     reported anywhere MUST be the sum of amountCents over exactly these rows
     -- one definition of the number, because two honest definitions of one
     quantity in one artifact is the canary failure. */
  function monthCharges(state, month) {
    if (!/^\d{4}-\d{2}$/.test(String(month))) {
      throw new Error('month must look like 2026-08');
    }
    var rows = state.charges.filter(function (c) {
      return c.createdAt.indexOf(month) === 0;
    }).map(function (c) {
      var r = residentById(state, c.residentId) ||
              { apartment: '', apartmentKey: '', area: '', name: '' };
      var o = orderById(state, c.orderId);
      /* THE BILLING KEY IS THE APARTMENT *AND* THE AREA. Villas 25 and Canopy
         25 are two households; this row carried only "25", so anyone pivoting
         the export billed both to one account. The engine knows the
         difference everywhere else -- residents are UNIQUE on
         (apartment_key, area_key), and the sign-in screen advertises this
         exact collision -- and the money was the one place it forgot. */
      var account = r.area ? (r.apartment + ' (' + r.area + ')') : r.apartment;
      /* AND THE ITEM COLUMN HAS TO EXPLAIN THE NUMBER BESIDE IT. It listed
         base dishes only, so a $3.50 soup invoiced at $9.00 with nothing in
         the row accounting for the $5.50 delivery fee -- the resident's own
         receipt itemises it and the business office's export did not. */
      var summary = '';
      if (o) {
        summary = o.items.map(function (i) {
          return i.name + (i.selectionText ? ' (' + i.selectionText + ')' : '') +
                 ' x' + i.qty;
        }).join('; ');
        if (o.feeCents) summary += '; delivery fee';
      }
      return {
        orderId: c.orderId, residentId: c.residentId, amountCents: c.amountCents,
        createdAt: c.createdAt, apartment: r.apartment, apartmentKey: r.apartmentKey,
        area: r.area || '', account: account,
        residentName: r.name,
        kind: c.kind || 'charge',
        feeCents: o ? (o.feeCents || 0) : 0,
        itemSummary: (c.kind === 'reversal' ? 'CANCELLED - ' : '') + summary
      };
    });
    rows.sort(function (a, b) {
      if (a.apartmentKey !== b.apartmentKey) return a.apartmentKey < b.apartmentKey ? -1 : 1;
      return a.createdAt < b.createdAt ? -1 : (a.createdAt > b.createdAt ? 1 : 0);
    });
    return rows;
  }

  function csvCell(s) {
    s = String(s == null ? '' : s);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  /* The invoice-run export. The TOTAL row is computed from the same rows it
     lists -- never from a separately-maintained running figure. */
  function monthCsv(state, month) {
    var rows = monthCharges(state, month);
    /* "account" rather than "apartment": it is the apartment qualified by

      items: items,
      residents: seed.residents.map(function (r, i) {

      allowanceBasis: seed.allowanceBasis || 'based on orders placed here',

      weekOf: seed.weekOf || '',

  }

    canonApartment: canonApartment, findResident: findResident,
    findResidents: findResidents, parseTowerApartment: parseTowerApartment,

    cartAdd: cartAdd, cartRemove: cartRemove, cartClear: cartClear,
    validateSelections: validateSelections, selectionKey: selectionKey,
    extrasCents: extrasCents, choiceName: choiceName,

    allergenHints: allergenHints, allergenScan: allergenScan,
    allergenTables: tables,
    newState: newState, money: money,
    RECEIVED: RECEIVED, PREPARING: PREPARING, READY: READY, OUT: OUT,
    COMPLETED: COMPLETED, CANCELLED: CANCELLED,
