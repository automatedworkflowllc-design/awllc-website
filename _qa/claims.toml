# Claims the public site makes, each tied to the thing that makes it true.
#
# Rule for adding an entry: name the SOURCE OF TRUTH, not a second copy of the
# number. "108 tests" is checked by collecting the test suite, not by grepping
# another page that also says 108 -- two pages agreeing with each other is not
# evidence, it is a rumour with a citation.
#
# If a claim genuinely cannot be re-derived here, mark it derive = "external"
# and say why. It will be reported as UNCHECKABLE every run, forever, which is
# the honest outcome. Deleting it to make the report green is the one edit
# nobody is allowed to make.

# --- flatline ------------------------------------------------------------
# The page sells the tool partly on its test count. If the suite shrinks, the
# page is overclaiming within the hour.
[[claim]]
id = "flatline-test-count"
page = "flatline/index.html"
says = "{} tests"
derive = "pytest_count"
args = { path = "C:/Users/hisbo/claude/dev/flatline" }

# --- /proof/ -------------------------------------------------------------
# The page deliberately says SIX OF EIGHT rather than "every". The moment a
# seventh job gets wrapped, that sentence becomes false by understatement --
# and if one gets unwrapped, false by overstatement. Both fail here.
[[claim]]
id = "proof-wrapped-jobs"
page = "proof/index.html"
says = "{} scheduled jobs"
derive = "wrapped_jobs"
args = { style = "words" }

# The headline stat must equal the newest PUBLISHED anchor, never the private
# ledger -- the page may not describe more history than it has published.
[[claim]]
id = "proof-receipt-count"
page = "proof/index.html"
says = "<b>{}</b><span>receipts on record"
derive = "anchor_receipts"

# The sample anchor line printed on the page must be the real newest one.
[[claim]]
id = "proof-anchor-head"
page = "proof/index.html"
says = "head=sha256:{}"
derive = "anchor_head"
args = { chars = 64 }

# --- the money figures ---------------------------------------------------
# $1,240 is the published example report's headline, and it is NOT stored
# anywhere: it is 410 + 520 + 310 from three rows of sample data. So the check
# redoes the arithmetic instead of grepping for a copy of the answer.
#
# There is deliberately no claim against /check/ itself. The first version of
# this file had one, and the audit failed it -- correctly: that page computes
# the figure from whatever the visitor drops and never states $1,240. The
# LEDGER was wrong and the page was right, so the entry came out. A claim
# ledger that gets "fixed" by editing the page to match it would be worse than
# having none at all.
[[claim]]
id = "check-example-money"
page = "check/example/index.html"
says = "{}"
derive = "sum_rows"
args = { source = "_brand/build_check_page.py", ids = ["J-104", "J-111", "J-112"] }

# --- the notary ----------------------------------------------------------
# The page's whole claim is that signing happens with Ed25519 in the browser.
# If that ever silently became a hash-only page, this fails.
[[claim]]
id = "notarize-ed25519"
page = "proof/notarize/index.html"
says = "{}"
derive = "from_source"
args = { source = "_brand/build_notarize_page.py", pattern = "(name:'Ed25519')" }

# --- honestly unverifiable here -----------------------------------------
# Hearth's record count lives in a different repo and a live data pipeline. We
# cannot re-derive it from this checkout, and pretending otherwise would be the
# exact failure this audit exists to catch.
[[claim]]
id = "hearth-record-count"
page = "builds/index.html"
derive = "external"
note = "60,000+ records is produced by the Hearth pipeline in another repo; re-derive there, not here"

# --- how many tools, and whether any of them phones home ------------------
# These two facts are the same sentence on every page that says them, so one
# deriver checks both: it counts the tools linked from the homepage band and
# raises if any of them contains a network call. Added 2026-08-17, after
# /workflow-automation/ was found claiming "six free tools", "Four tools" and
# "four tools that run in your browser" on one page while the homepage
# correctly said eight. Correcting the copy does not close that -- the number
# had already rotted once before and nothing was watching it.
#
# NOTE the deliberate asymmetry: the homepage claim is checked in WORDS
# ("Eight tools") and is also the page the count is derived from. That is not
# circular -- the count comes from the band's LINKS and the assertion is
# against its PROSE, which is exactly the pair that drifted apart here.
[[claim]]
id = "home-tool-count"
page = "index.html"
says = "{} tools that run"
derive = "browser_tools"
args = { style = "Words" }

[[claim]]
id = "workflow-tool-count-hero"
page = "workflow-automation/index.html"
says = "{} free tools on this site run entirely in your browser"
derive = "browser_tools"
args = { style = "words" }

[[claim]]
id = "workflow-tool-count-bench"
page = "workflow-automation/index.html"
says = "{} tools on this site."
derive = "browser_tools"
args = { style = "Words" }

[[claim]]
id = "workflow-tool-count-ledger"
page = "workflow-automation/index.html"
says = "{} tools that run in your browser"
derive = "browser_tools"
args = { style = "words" }

# --- flatline's test count, everywhere it is quoted ----------------------
# /flatline/ had this right at 122 and was already checked. Two OTHER pages
# quoted the same suite at 108 and nothing was watching them, so the number
# was stale by 14 for as long as it took someone to look. Found 2026-08-17
# alongside the tool-count drift; same defect, different number.
#
# The lesson worth keeping: checking the number on its OWN page is not enough
# when other pages quote it. Every page that states a figure needs its own
# claim, because a figure copied to a second page has a second lifetime.
[[claim]]
id = "builds-flatline-tests"
page = "builds/index.html"
says = "{} tests, MIT, public"
derive = "pytest_count"
args = { path = "C:/Users/hisbo/claude/dev/flatline" }

[[claim]]
id = "workflow-flatline-tests"
page = "workflow-automation/index.html"
says = "MIT licensed, {} tests."
derive = "pytest_count"
args = { path = "C:/Users/hisbo/claude/dev/flatline" }

[[claim]]
id = "workflow-ledger-tests"
page = "workflow-automation/index.html"
says = "open-source repos, {} tests"
derive = "pytest_count"
args = { path = "C:/Users/hisbo/claude/dev/flatline" }

# The repo count is GitHub state, not repo state -- a local clone cannot prove
# a repo is PUBLIC, and this gate is deliberately offline so that pushing
# without a network still works. So it is honestly UNCHECKABLE here rather
# than checked against something that only looks like the source of truth.
# Re-derive with:
#   curl -s https://api.github.com/users/automatedworkflowllc-design/repos \
#     | python -c "import sys,json;print(sum(1 for r in json.load(sys.stdin) if not r['private'] and (r.get('license') or {}).get('spdx_id')=='MIT'))"
# It read 8 on 2026-08-17 (airlock attest canary custody docket flatline
# hearth watchpost). tare is PRIVATE and is deliberately not counted.
[[claim]]
id = "workflow-open-source-repos"
page = "workflow-automation/index.html"
derive = "external"
note = "count of PUBLIC MIT repos is GitHub state; this gate is offline by design. Re-derive with the curl in claims.toml; was 8 on 2026-08-17"
