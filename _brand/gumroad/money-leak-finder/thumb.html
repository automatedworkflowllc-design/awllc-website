<!doctype html><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{zoom:1.25;width:600px;height:600px;overflow:hidden;background:#211D14;position:relative;
       font-family:Georgia,'Times New Roman',serif}
  .rainbow{position:absolute;top:0;left:0;right:0;height:9px;
    background:linear-gradient(90deg,#E1483E,#F08A24,#EFC939,#4FAE4A,#3E7FD9,#9B4FB8)}
  .wrap{padding:56px 48px;text-align:left}
  .mark{font-family:ui-monospace,Consolas,monospace;font-size:17px;color:#FBFAF3;letter-spacing:.06em}
  .mark b{color:#74E1EC}
  h1{font-size:57px;line-height:1.06;color:#FBFAF3;letter-spacing:-.015em;font-weight:700;margin-top:40px}
  h1 em{font-style:italic;color:#CBC5B1}
  .chip{display:inline-block;background:#F6E7E7;color:#B23B3B;border-radius:14px;
    padding:14px 22px;font-size:34px;font-weight:700;margin-top:44px;letter-spacing:-.01em}
  .chip .lbl{display:block;font-family:ui-monospace,Consolas,monospace;font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;color:#8a5050;font-weight:400;margin-bottom:4px}
  .foot{position:absolute;left:48px;right:48px;bottom:42px;color:#8B8471;
    font-family:ui-monospace,Consolas,monospace;font-size:14px;letter-spacing:.05em}
</style>
<div class="rainbow"></div>
<div class="wrap">
  <span class="mark">{<b>a_w</b>} automated_workflow</span>
  <h1>Money<br>Leak<br><em>Finder</em></h1>
  <div class="chip"><span class="lbl">sample find · invented data</span>$1,280 never invoiced</div>
</div>
<div class="foot">// Excel + Google Sheets · live formulas</div>
